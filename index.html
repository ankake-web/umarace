<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>うまダッシュ・ターフ</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --card: #fffaf0;
      --ink: #29231b;
      --muted: #766d62;
      --line: #d9c9ac;
      --accent: #7a4b20;
      --accent2: #198754;
      --danger: #b3261e;
      --shadow: 0 10px 24px rgba(49, 34, 18, .12);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #fff8df 0, var(--bg) 44%, #eadcc8 100%);
      color: var(--ink);
    }
    button, input { font: inherit; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      background: var(--accent);
      color: white;
      font-weight: 800;
      box-shadow: 0 4px 10px rgba(0,0,0,.12);
    }
    button.secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    button.good { background: var(--accent2); }
    button.danger { background: var(--danger); }
    button:disabled { opacity: .45; box-shadow: none; }
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fff;
      color: var(--ink);
    }
    .app { max-width: 980px; margin: 0 auto; padding: 12px; padding-bottom: 32px; }
    .hero {
      background: linear-gradient(135deg, #4d8a4d, #246a46);
      color: white;
      border-radius: 24px;
      padding: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }
    .hero:after { content: "🐎"; position: absolute; right: 12px; top: 0; font-size: 88px; opacity: .22; transform: rotate(-8deg); }
    h1 { margin: 0; font-size: 28px; letter-spacing: .03em; }
    .subtitle { margin-top: 6px; opacity: .9; font-size: 13px; }
    .grid { display: grid; gap: 10px; }
    .two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .card {
      background: rgba(255, 250, 240, .94);
      border: 1px solid rgba(217, 201, 172, .9);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow);
      margin-top: 12px;
    }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .between { justify-content: space-between; }
    .small { font-size: 12px; color: var(--muted); }
    .tiny { font-size: 11px; color: var(--muted); }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 800;
    }
    .money { font-variant-numeric: tabular-nums; font-weight: 900; }
    .current { outline: 3px solid rgba(25, 135, 84, .25); }
    .playerBox { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px; }

    .homeHeroCard {
      margin-top: 12px;
      padding: 20px;
      border-radius: 26px;
      background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,.9), transparent 34%),
        linear-gradient(135deg, #215f3b, #3b8f52 58%, #d7a447);
      color: white;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      min-height: 210px;
    }
    .homeHeroCard:after {
      content: "🐎";
      position: absolute;
      right: -8px;
      bottom: -20px;
      font-size: 132px;
      opacity: .24;
      transform: rotate(-10deg);
    }
    .homeTitle {
      font-size: clamp(30px, 8vw, 54px);
      font-weight: 950;
      letter-spacing: .04em;
      line-height: 1.05;
      margin: 0;
      text-shadow: 0 3px 12px rgba(0,0,0,.22);
    }
    .homeLead { max-width: 540px; margin-top: 10px; font-weight: 750; opacity: .96; }
    .homePanel { margin-top: 12px; display:grid; grid-template-columns: 1.2fr .8fr; gap: 12px; }
    .homeForm, .homeHowTo {
      background: rgba(255,250,240,.94);
      border: 1px solid rgba(217,201,172,.9);
      border-radius: 22px;
      padding: 14px;
      box-shadow: var(--shadow);
    }
    .homeHowTo ol { margin: 8px 0 0; padding-left: 20px; }
    .homeHowTo li { margin: 6px 0; }

    .scoreGrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .mood {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 950;
      border: 1px solid rgba(0,0,0,.08);
    }
    .moodGood { background: #ffe0d3; color: #9e2b14; }
    .moodNormal { background: #e8f5e9; color: #1b5e20; }
    .moodBad { background: #e3f2fd; color: #0d47a1; }

    .dicePanel { margin-top: 10px; display:flex; justify-content:center; }
    .diceStage {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 10px 14px;
      box-shadow: 0 6px 16px rgba(0,0,0,.12);
    }
    .diceCube {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 30% 25%, #fff, #f5f5f5 45%, #d9d9d9);
      border: 3px solid #222;
      font-size: 30px;
      box-shadow: 0 8px 0 #b8b8b8, 0 12px 16px rgba(0,0,0,.22);
      transform: rotate(-5deg);
    }
    .diceCube.rolling { animation: diceShake .12s infinite alternate, diceSpin .6s infinite linear; }
    .diceText { font-size: 13px; font-weight: 900; }
    .diceFaces { letter-spacing: .12em; color: var(--muted); font-size: 12px; }
    .horseshoe { display: inline-grid; place-items: center; width: 1.2em; height: 1.2em; font-weight: 950; font-size: 1.05em; line-height: 1; }
    @keyframes diceShake { from { translate: -3px -2px; } to { translate: 3px 2px; } }
    @keyframes diceSpin { from { rotate: 0deg; } to { rotate: 360deg; } }

    .sugorokuBoardWrap { margin-top: 10px; }
    .sugorokuBoard {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 4px;
      padding: 8px;
      border-radius: 22px;
      background: linear-gradient(180deg, #347f43, #236839);
      border: 6px solid #6c4a25;
      box-shadow: inset 0 0 0 4px rgba(255,255,255,.17), var(--shadow);
    }
    .space {
      min-height: 42px;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      background: transparent;
    }
    .space.path {
      background: linear-gradient(180deg, #f4d29b, #c9924e);
      border: 2px solid rgba(77,45,18,.42);
      box-shadow: inset 0 2px 0 rgba(255,255,255,.32);
    }
    .space.empty { visibility: hidden; }
    .space.start { background: repeating-linear-gradient(45deg, #fff 0 8px, #222 8px 16px); color: #222; }
    .space.finish { background: linear-gradient(180deg, #ffe26a, #d79a1c); }
    .space.pace { outline: 3px solid #fff178; }
    .spaceNum { position: absolute; left: 4px; top: 3px; font-size: 10px; font-weight: 950; color: rgba(49,35,20,.72); z-index: 2; }
    .spaceLabel { position: absolute; right: 4px; bottom: 3px; font-size: 8px; font-weight: 950; color: rgba(49,35,20,.72); z-index: 2; }
    .spaceHorses {
      position: absolute;
      inset: 15px 3px 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1px;
      z-index: 4;
    }
    .miniHorse {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: #fff;
      border: 3px solid var(--horse-color);
      box-shadow: 0 3px 8px rgba(0,0,0,.2);
      font-size: 13px;
      transition: transform .18s ease;
    }
    .miniHorse.animating { transform: scale(1.18); box-shadow: 0 0 0 4px rgba(255,235,59,.7), 0 6px 12px rgba(0,0,0,.24); }
    .miniHorse.latest { animation: horseHop .8s ease both; }
    .miniHorse.blocked { animation: blockedBounce .95s ease both; }
    @keyframes horseHop {
      0% { transform: translateY(0) scale(1); }
      35% { transform: translateY(-10px) scale(1.15); }
      70% { transform: translateY(1px) scale(.98); }
      100% { transform: translateY(0) scale(1); }
    }
    @keyframes blockedBounce {
      0% { transform: translateX(0) scale(1); }
      25% { transform: translateX(12px) translateY(-5px) scale(1.12); }
      55% { transform: translateX(-8px) scale(.98); }
      80% { transform: translateX(3px); }
      100% { transform: translateX(0) scale(1); }
    }
    .moveBanner {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 14px;
      background: #fff7d6;
      border: 1px solid #e3c765;
      font-size: 12px;
      font-weight: 850;
    }
    .cardStrip { margin-top: 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .horseCard {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 10px;
      font-size: 12px;
      transition: transform .15s, box-shadow .15s, outline .15s;
    }
    .horseCard.clickable { cursor: pointer; }
    .horseCard.clickable:active { transform: scale(.98); }
    .horseCard.selectedCard { outline: 3px solid rgba(25, 135, 84, .35); box-shadow: 0 8px 18px rgba(25,135,84,.18); }
    .horseCard.moved { opacity: .52; }
    .horseCardHeader { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .horseName { font-weight: 950; font-size: 14px; }
    .remainTag { font-size: 11px; color: var(--muted); font-weight: 850; }
    .moveNums { display:flex; gap:4px; flex-wrap:wrap; margin-top:7px; }
    .moveNums span { background:#f6efe2; border-radius:999px; padding:3px 6px; font-size:11px; font-weight:850; }

    .betArea { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .horseBet { border: 1px solid var(--line); border-radius: 14px; padding: 9px; background: #fff; min-height: 74px; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .chip { min-width: 26px; height: 26px; border-radius: 999px; border: 2px solid #444; display: inline-grid; place-items: center; font-size: 12px; font-weight: 900; background: #fff; color: #222; }
    .betList { display:grid; gap:8px; margin-top:8px; }
    .betPlayer { background:#fff; border:1px solid var(--line); border-radius:14px; padding:8px; }
    .betMini { display:flex; flex-wrap:wrap; gap:5px; margin-top:5px; }

    .actions {
      margin-top: 12px;
      background: rgba(255,250,240,.96);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 10px;
      box-shadow: var(--shadow);
    }
    .primaryActionRow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .primaryActionRow button { flex: 1 1 auto; }
    .stickyDiceMini {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 9px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 900;
    }
    .stickyDiceIcon { font-size: 20px; }
    .log { max-height: 160px; overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
    .log div { padding: 4px 0; border-bottom: 1px dashed #eee; font-size: 12px; }
    .rank { font-size: 24px; font-weight: 900; }

    @media (max-width: 560px) {
      .homePanel, .two, .scoreGrid, .betArea, .cardStrip { grid-template-columns: 1fr; }
      .homeHeroCard { min-height: 190px; }
      .sugorokuBoard { gap: 3px; padding: 5px; border-width: 4px; }
      .space { min-height: 31px; border-radius: 8px; }
      .space.path { border-width: 1px; }
      .spaceNum { font-size: 8px; left: 3px; top: 2px; }
      .spaceLabel { font-size: 7px; right: 3px; bottom: 2px; }
      .miniHorse { width: 18px; height: 18px; font-size: 11px; border-width: 2px; }
      .spaceHorses { inset: 12px 2px 2px; }
      .app { padding: 8px; padding-bottom: 32px; }
      h1 { font-size: 24px; }
      .actions { border-radius: 18px; }
    }
  </style>
</head>
<body>
  <div id="app" class="app"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCxHux7rE19LCvV-2sNwhEMtGABf3tZgDs",
    authDomain: "umauma-737d6.firebaseapp.com",
    projectId: "umauma-737d6",
    storageBucket: "umauma-737d6.firebasestorage.app",
    messagingSenderId: "704545420057",
    appId: "1:704545420057:web:9fa4081aa62dc5900d4b88",
    measurementId: "G-0E7DM5B4VB"
  };

  const GAME_TITLE = "うまダッシュ・ターフ";
  const MAX_PLAYERS = 6;
  const GOAL_LINE = 36;
  const PACE_SPACE = 22;

  const FACE = { horse: "🐎", cap: "🧢", carrot: "🥕", shoe: '<span class="horseshoe">∪</span>' };
  const DICE = [
    { key: "horse", label: "馬", icon: "🐎" },
    { key: "horse", label: "馬", icon: "🐎" },
    { key: "horse", label: "馬", icon: "🐎" },
    { key: "cap", label: "キャップ", icon: "🧢" },
    { key: "carrot", label: "人参", icon: "🥕" },
    { key: "shoe", label: "蹄鉄", icon: "∪" }
  ];

  const HORSES = [
    { id: "red",    colorName: "赤", label: "レッドインパクト", base: { horse: 2, cap: 12, carrot: 5, shoe: 7 },  color: "#e53935", source: "ディープインパクト" },
    { id: "black",  colorName: "黒", label: "コタサンブラック", base: { horse: 7, cap: 2,  carrot: 4, shoe: 3 },  color: "#222222", source: "キタサンブラック" },
    { id: "pink",   colorName: "桃", label: "オグリピンク",     base: { horse: 4, cap: 3,  carrot: 12, shoe: 3 }, color: "#f78ac3", source: "オグリキャップ" },
    { id: "yellow", colorName: "黄", label: "イエローアイ",     base: { horse: 3, cap: 10, carrot: 8, shoe: 3 },  color: "#f2c94c", source: "アーモンドアイ" },
    { id: "green",  colorName: "緑", label: "グリーンテイオー", base: { horse: 4, cap: 11, carrot: 1, shoe: 6 },  color: "#27ae60", source: "トウカイテイオー" },
    { id: "white",  colorName: "白", label: "シロイロックス",   base: { horse: 5, cap: 8,  carrot: 2, shoe: 5 },  color: "#f8f8f8", source: "イクイノックス" },
    { id: "blue",   colorName: "青", label: "オルフェーブルー", base: { horse: 1, cap: 14, carrot: 1, shoe: 12 }, color: "#2f80ed", source: "オルフェーヴル" }
  ];

  const MOOD = {
    good:   { label: "好調", face: "😄", delta: 0, className: "moodGood" },
    normal: { label: "普通", face: "🙂", delta: 3, className: "moodNormal" },
    bad:    { label: "不調", face: "😣", delta: 6, className: "moodBad" }
  };

  const PAYOUT_TABLE = {
    1: [500, 350, 250, 200, 150],
    2: [350, 250, 200, 150, 100],
    3: [250, 200, 150, 100, 100]
  };

  const PLAYER_COLORS = ["#e53935", "#1e88e5", "#43a047", "#8e24aa", "#fb8c00", "#546e7a"];
  const CPU_NAMES = ["CPUミドリ", "CPUアオ", "CPUモモ", "CPUクロ", "CPUキイロ"];

  let appEl = document.getElementById("app");
  let localId = localStorage.getItem("umaDashPlayerId") || crypto.randomUUID();
  localStorage.setItem("umaDashPlayerId", localId);
  let localName = localStorage.getItem("umaDashPlayerName") || "プレイヤー";
  let roomCode = new URL(location.href).hash.replace("#", "").trim().toUpperCase();
  let room = null, db = null, online = false, roomRef = null, unsubscribe = null;
  let cpuTimer = null, animationState = null, animationTimer = null, lastAnimatedMoveTs = null;
  let audioCtx = null, bgmOn = false, bgmTimer = null, bgmStep = 0;

  async function initFirebase() {
    if (!firebaseConfig.apiKey || !firebaseConfig.projectId) return;
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    await signInAnonymously(auth);
    db = getFirestore(app);
    online = true;
  }

  function clone(x) { return JSON.parse(JSON.stringify(x)); }
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function randomCode() { return Math.random().toString(36).slice(2, 6).toUpperCase(); }
  function horseInfo(id) { return HORSES.find(h => h.id === id); }
  function currentPlayer(r = room) { return r.players[r.turnIndex % r.players.length]; }
  function currentBetPlayer(r = room) { return r.players[(r.starterIndex + r.race.bets.length) % r.players.length]; }
  function chipsForRule() { return [2, 1, 1]; }
  function diceObj(key) { return DICE.find(d => d.key === key); }
  function isHost() { return room?.hostId === localId; }
  function isLocalTurn() { return currentPlayer()?.id === localId; }
  function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c])); }
  function face(key) { return FACE[key] || key; }
  function effectiveTotal(m) { return m.horse * 3 + m.cap + m.carrot + m.shoe; }
  function averageMove(m) { return (effectiveTotal(m) / 6).toFixed(1); }
  function moodBadge(moodKey) {
    const m = MOOD[moodKey] || MOOD.normal;
    return `<span class="mood ${m.className}">${m.face} ${m.label}</span>`;
  }
  function horseDisplayName(hid) {
    const h = horseInfo(hid);
    return `${h?.colorName || ""} ${h?.label || hid}`;
  }
  function horseCard(hid, r = room) { return r?.race?.cards?.find(c => c.horse === hid); }

  function reduceStats(base, delta) {
    const stats = clone(base);
    let remaining = delta;
    let guard = 0;
    while (remaining > 0 && guard < 200) {
      guard++;
      const actions = [];
      if (remaining >= 3 && stats.horse > 1) actions.push({ key: "horse", cost: 3, weight: 2 });
      for (const k of ["cap", "carrot", "shoe"]) {
        if (stats[k] > 1) actions.push({ key: k, cost: 1, weight: 3 });
      }
      const available = actions.filter(a => a.cost <= remaining);
      if (!available.length) break;
      const pool = [];
      available.forEach(a => { for (let i = 0; i < a.weight; i++) pool.push(a); });
      const pick = pool[Math.floor(Math.random() * pool.length)];
      stats[pick.key] -= 1;
      remaining -= pick.cost;
    }
    return stats;
  }

  function makeRaceCards() {
    const moods = ["good", "normal", "bad"];
    return HORSES.map(h => {
      const mood = moods[Math.floor(Math.random() * moods.length)];
      const moves = reduceStats(h.base, MOOD[mood].delta);
      return {
        horse: h.id,
        name: h.label,
        colorName: h.colorName,
        source: h.source,
        mood,
        moves,
        expected: Number(averageMove(moves)),
        id: crypto.randomUUID(),
        moved: false
      };
    });
  }

  async function saveRoom(next) {
    room = next;
    if (online && roomCode) {
      await setDoc(roomRef, next);
    } else {
      localStorage.setItem("umaDashLocalRoom", JSON.stringify(next));
      maybeStartMoveAnimation();
      render();
      maybeRunCpu();
    }
  }

  async function createRoom() {
    localName = (document.getElementById("playerName")?.value || localName || "プレイヤー").trim();
    localStorage.setItem("umaDashPlayerName", localName);
    roomCode = (document.getElementById("roomCode")?.value || randomCode()).trim().toUpperCase();
    history.replaceState(null, "", "#" + roomCode);
    const base = {
      version: 6,
      title: GAME_TITLE,
      code: roomCode,
      hostId: localId,
      phase: "lobby",
      raceNo: 0,
      turnIndex: 0,
      starterIndex: 0,
      players: [{ id: localId, name: localName, type: "human", color: PLAYER_COLORS[0], money: 0, seat: 0 }],
      race: null,
      createdAt: Date.now(),
      updatedAt: Date.now()
    };
    await openRoom(roomCode);
    await saveRoom(base);
  }

  async function joinRoom() {
    localName = (document.getElementById("playerName")?.value || localName || "プレイヤー").trim();
    localStorage.setItem("umaDashPlayerName", localName);
    roomCode = (document.getElementById("roomCode")?.value || roomCode || "").trim().toUpperCase();
    if (!roomCode) return alert("部屋番号を入れてください");
    history.replaceState(null, "", "#" + roomCode);
    await openRoom(roomCode);
  }

  async function openRoom(code) {
    roomCode = code;
    if (unsubscribe) unsubscribe();
    if (online) {
      roomRef = doc(db, "rooms", roomCode);
      unsubscribe = onSnapshot(roomRef, async snap => {
        if (!snap.exists()) { room = null; render(); return; }
        room = snap.data();
        await maybeJoinAsHuman();
        maybeStartMoveAnimation();
        render();
        maybeRunCpu();
      });
    } else {
      const saved = localStorage.getItem("umaDashLocalRoom");
      room = saved ? JSON.parse(saved) : null;
      render();
      maybeRunCpu();
    }
  }

  async function maybeJoinAsHuman() {
    if (!room || room.phase !== "lobby") return;
    if (room.players.some(p => p.id === localId)) return;
    if (room.players.length >= MAX_PLAYERS) return;
    const next = clone(room);
    next.players.push({
      id: localId,
      name: localName || "プレイヤー",
      type: "human",
      color: PLAYER_COLORS[next.players.length],
      money: 0,
      seat: next.players.length
    });
    next.updatedAt = Date.now();
    await saveRoom(next);
  }

  async function addCpu() {
    if (!isHost() || !room || room.players.length >= MAX_PLAYERS) return;
    const next = clone(room);
    const cpuCount = next.players.filter(p => p.type === "cpu").length;
    if (cpuCount >= 5) return;
    next.players.push({
      id: "cpu-" + crypto.randomUUID(),
      name: CPU_NAMES[cpuCount] || `CPU${cpuCount + 1}`,
      type: "cpu",
      color: PLAYER_COLORS[next.players.length],
      money: 0,
      seat: next.players.length
    });
    await saveRoom(next);
  }

  async function startGame() {
    if (!isHost()) return;
    const next = clone(room);
    next.players.forEach(p => p.money = 0);
    next.raceNo = 1;
    setupRace(next);
    await saveRoom(next);
  }

  function chooseStarterIndex(r) {
    return Math.floor(Math.random() * r.players.length);
  }

  function setupRace(r) {
    r.phase = "betting";
    r.starterIndex = chooseStarterIndex(r);
    r.turnIndex = r.starterIndex;

    const cards = makeRaceCards();
    const startPositions = shuffle([1,2,3,4,5,6,7]);
    const horses = {};
    cards.forEach((card, idx) => {
      horses[card.horse] = { pos: startPositions[idx], startPos: startPositions[idx], status: "running", rank: null };
    });

    r.race = {
      no: r.raceNo,
      cards,
      horses,
      bets: [],
      dice: null,
      diceRolling: false,
      finishOrder: [],
      paceHorse: null,
      lastHorse: null,
      payout: null,
      lastMove: null,
      log: [`第${r.raceNo}レース開始。賭け順・調子・スタート位置が決まりました。`]
    };
  }

  function remainingChips(r, playerId) {
    const chips = chipsForRule();
    for (const bet of r.race.bets.filter(b => b.playerId === playerId)) {
      const idx = chips.indexOf(bet.chip);
      if (idx >= 0) chips.splice(idx, 1);
    }
    return chips;
  }
  function nextChip(r, playerId) {
    return remainingChips(r, playerId)[0] ?? null;
  }
  function alreadyBetHorses(r, playerId) {
    return new Set(r.race.bets.filter(b => b.playerId === playerId).map(b => b.horse));
  }

  async function placeBet(horseId) {
    if (!room || room.phase !== "betting") return;
    const p = currentBetPlayer(room);
    if (p.id !== localId || p.type !== "human") return;
    const chip = nextChip(room, p.id);
    if (chip === null) return;
    if (alreadyBetHorses(room, p.id).has(horseId)) return alert("同じ馬には2枚以上置けません");

    const next = clone(room);
    next.race.bets.push({ id: crypto.randomUUID(), playerId: p.id, horse: horseId, chip });
    next.race.log.unshift(`${p.name} が ${horseDisplayName(horseId)} に${chip}チップを置きました。`);
    afterBet(next);
    await saveRoom(next);
  }

  function afterBet(r) {
    const totalNeeded = r.players.length * chipsForRule().length;
    if (r.race.bets.length >= totalNeeded) {
      r.phase = "racing";
      r.turnIndex = r.starterIndex;
      r.race.dice = null;
      r.race.diceRolling = false;
      r.race.log.unshift("賭け終了。レース開始！");
    } else {
      const p = currentBetPlayer(r);
      r.race.log.unshift(`次は ${p.name} の賭けです。`);
    }
  }

  async function rollDice() {
    if (!room || room.phase !== "racing" || !isLocalTurn() || currentPlayer(room)?.type !== "human" || room.race.dice || room.race.diceRolling) return;
    const next = clone(room);
    next.race.dice = null;
    next.race.diceRolling = true;
    next.race.log.unshift(`${currentPlayer(next).name} がサイコロを振っています…`);
    await saveRoom(next);
    playEffect("dice");

    setTimeout(async () => {
      if (!room || room.phase !== "racing" || currentPlayer(room)?.id !== localId || !room.race.diceRolling) return;
      const latest = clone(room);
      const d = DICE[Math.floor(Math.random() * DICE.length)];
      latest.race.dice = d.key;
      latest.race.diceRolling = false;
      latest.race.log.unshift(`${currentPlayer(latest).name} の出目：${d.icon} ${d.label}`);
      await saveRoom(latest);
    }, 850);
  }

  function activeCards(r) {
    let cards = r.race.cards.filter(c => r.race.horses[c.horse]?.status === "running" && !c.moved);
    if (cards.length === 0) {
      r.race.cards.forEach(c => { if (r.race.horses[c.horse]?.status === "running") c.moved = false; });
      cards = r.race.cards.filter(c => r.race.horses[c.horse]?.status === "running");
      r.race.log.unshift("全頭が一度動いたので、カードを表に戻しました。");
    }
    return cards;
  }

  async function moveHorse(horseId) {
    if (!room || room.phase !== "racing" || !isLocalTurn() || !room.race.dice) return;
    const next = clone(room);
    doMoveHorse(next, horseId);
    await saveRoom(next);
    playEffect("move");
  }

  function doMoveHorse(r, horseId) {
    const p = currentPlayer(r);
    const diceKey = r.race.dice;
    const card = r.race.cards.find(c => c.horse === horseId);
    if (!card || card.moved || r.race.horses[horseId].status !== "running") return;

    const move = Number(card.moves[diceKey] || 0);
    const h = r.race.horses[horseId];
    const before = h.pos;
    const rawTarget = before + move;
    const forwardPath = [];
    for (let step = before + 1; step <= Math.min(rawTarget, GOAL_LINE); step++) forwardPath.push(step);

    if (!r.race.paceHorse && rawTarget >= PACE_SPACE) {
      r.race.paceHorse = horseId;
      r.race.log.unshift(`${horseDisplayName(horseId)} がペースホース！`);
    }

    if (rawTarget > GOAL_LINE) {
      h.status = "finished";
      h.rank = r.race.finishOrder.length + 1;
      h.pos = GOAL_LINE + h.rank;
      r.race.finishOrder.push(horseId);
      card.moved = true;
      r.race.lastMove = { horse: horseId, from: before, rawTarget, finalTarget: h.pos, blocked: false, path: [...forwardPath, GOAL_LINE], ts: Date.now() };
      r.race.log.unshift(`${p.name} が ${horseDisplayName(horseId)} を ${move}進め、${h.rank}着でゴール！`);
    } else {
      const occupied = new Set(Object.entries(r.race.horses)
        .filter(([hid, state]) => hid !== horseId && state.status === "running")
        .map(([_, state]) => state.pos));
      let target = rawTarget;
      while (target > before && occupied.has(target)) target--;
      const blocked = target < rawTarget;
      const path = [...forwardPath];
      if (blocked) {
        for (let step = Math.min(rawTarget, GOAL_LINE) - 1; step >= target; step--) path.push(step);
      }
      h.pos = target;
      card.moved = true;
      r.race.lastMove = { horse: horseId, from: before, rawTarget, finalTarget: target, blocked, path, ts: Date.now() };
      if (blocked) {
        r.race.log.unshift(`${p.name} が ${horseDisplayName(horseId)} を${rawTarget}まで進めようとしましたが、埋まっていたため${target}まで戻りました。`);
      } else {
        r.race.log.unshift(`${p.name} が ${horseDisplayName(horseId)} を ${before} → ${target} に進めました。`);
      }
    }

    if (r.race.finishOrder.length >= 3) {
      finishRace(r);
      return;
    }

    activeCards(r);
    r.turnIndex = (r.turnIndex + 1) % r.players.length;
    r.race.dice = null;
    r.race.diceRolling = false;
  }

  function finishRace(r) {
    const running = Object.entries(r.race.horses).filter(([_, s]) => s.status === "running");
    running.sort((a, b) => a[1].pos - b[1].pos);
    const lastHorse = running[0]?.[0] || null;
    r.race.lastHorse = lastHorse;
    if (lastHorse) r.race.horses[lastHorse].rank = 7;
    r.race.payout = calculatePayout(r);
    r.phase = r.raceNo >= 3 ? "gameover" : "payout";
    r.race.log.unshift(`第${r.raceNo}レース終了。払い戻しを計算しました。`);
  }

  function calculatePayout(r) {
    const multiplier = r.raceNo === 3 ? 2 : 1;
    const horseTotals = {};
    HORSES.forEach(h => horseTotals[h.id] = 0);
    for (const bet of r.race.bets) horseTotals[bet.horse] += bet.chip;

    const playerResults = r.players.map(p => ({ playerId: p.id, name: p.name, before: p.money, gain: 0, loss: 0, details: [] }));
    function resultOf(pid) { return playerResults.find(x => x.playerId === pid); }

    for (const bet of r.race.bets) {
      const res = resultOf(bet.playerId);
      const rankIndex = r.race.finishOrder.indexOf(bet.horse);
      if (rankIndex >= 0 && rankIndex < 3) {
        const rank = rankIndex + 1;
        const total = Math.max(1, horseTotals[bet.horse]);
        const col = Math.min(total, 5) - 1;
        let amount = PAYOUT_TABLE[rank][col] * bet.chip;
        if (r.race.paceHorse === bet.horse) amount += 100 * bet.chip;
        amount *= multiplier;
        res.gain += amount;
        res.details.push(`${horseDisplayName(bet.horse)} ${rank}着 +${amount}`);
      }
      if (r.race.lastHorse === bet.horse) {
        const amount = 100 * bet.chip * multiplier;
        res.loss += amount;
        res.details.push(`${horseDisplayName(bet.horse)} 最下位 -${amount}`);
      }
    }

    for (const res of playerResults) {
      const player = r.players.find(p => p.id === res.playerId);
      player.money += res.gain;
      const payable = Math.min(player.money, res.loss);
      player.money -= payable;
      res.loss = payable;
      res.after = player.money;
      res.net = res.after - res.before;
    }
    return { multiplier, horseTotals, playerResults };
  }

  async function nextRace() {
    if (!isHost() || !room || room.phase !== "payout") return;
    const next = clone(room);
    next.raceNo += 1;
    setupRace(next);
    await saveRoom(next);
  }

  async function backToLobby() {
    if (!isHost() || !room) return;
    const next = clone(room);
    next.phase = "lobby";
    next.raceNo = 0;
    next.race = null;
    next.players.forEach(p => p.money = 0);
    await saveRoom(next);
  }

  async function quitToTop() {
    if (!room) return;
    const oldId = localId;
    const next = clone(room);
    const me = next.players.find(p => p.id === oldId);
    if (me) {
      me.type = "cpu";
      me.name = `CPU代理-${me.name.replace(/^CPU代理-/, "")}`;
    }
    const otherHuman = next.players.find(p => p.type === "human" && p.id !== oldId);
    if (next.hostId === oldId && otherHuman) next.hostId = otherHuman.id;
    next.race?.log?.unshift(`${me?.name || "退出者"} が操作をCPUに引き継ぎました。`);
    next.updatedAt = Date.now();
    await saveRoom(next);

    if (unsubscribe) unsubscribe();
    clearTimeout(cpuTimer);
    localId = crypto.randomUUID();
    localStorage.setItem("umaDashPlayerId", localId);
    room = null;
    roomCode = "";
    history.replaceState(null, "", location.pathname);
    render();
  }

  function cpuChooseBet(r, cpu) {
    const used = alreadyBetHorses(r, cpu.id);
    const chip = nextChip(r, cpu.id);
    const options = r.race.cards
      .filter(c => !used.has(c.horse))
      .map(c => {
        const state = r.race.horses[c.horse];
        const popularity = r.race.bets.filter(b => b.horse === c.horse).reduce((s, b) => s + b.chip, 0);
        const moodScore = c.mood === "good" ? 8 : c.mood === "normal" ? 3 : -4;
        return { horse: c.horse, score: state.pos * 1.3 + c.expected * 3 + moodScore - popularity * 2 + Math.random() * 5 };
      })
      .sort((a, b) => b.score - a.score);
    return { chip, horse: options[0].horse };
  }

  function cpuChooseMove(r, cpu) {
    if (!r.race.dice) return null;
    const cards = activeCards(r);
    const own = Object.fromEntries(r.race.bets.filter(b => b.playerId === cpu.id).map(b => [b.horse, b.chip]));
    const options = cards.map(c => {
      const move = Number(c.moves[r.race.dice] || 0);
      const pos = r.race.horses[c.horse].pos;
      const ownChip = own[c.horse] || 0;
      const others = r.race.bets.filter(b => b.horse === c.horse && b.playerId !== cpu.id).reduce((s, b) => s + b.chip, 0);
      let score = move * 4 + ownChip * 38 - others * 8 + Math.random() * 8;
      if (ownChip && pos + move >= PACE_SPACE && !r.race.paceHorse) score += 25;
      if (ownChip && pos + move > GOAL_LINE) score += 100;
      if (!ownChip && pos + move > GOAL_LINE) score -= 35;
      return { horse: c.horse, score };
    }).sort((a, b) => b.score - a.score);
    return options[0]?.horse;
  }

  function maybeRunCpu() {
    clearTimeout(cpuTimer);
    if (!room || !isHost()) return;
    const cpuAction = async () => {
      if (!room || !isHost()) return;
      const next = clone(room);
      if (next.phase === "betting") {
        const p = currentBetPlayer(next);
        if (p?.type !== "cpu") return;
        const choice = cpuChooseBet(next, p);
        next.race.bets.push({ id: crypto.randomUUID(), playerId: p.id, horse: choice.horse, chip: choice.chip });
        next.race.log.unshift(`${p.name} が ${horseDisplayName(choice.horse)} に${choice.chip}チップを置きました。`);
        afterBet(next);
        await saveRoom(next);
      } else if (next.phase === "racing") {
        const p = currentPlayer(next);
        if (p?.type !== "cpu") return;
        if (!next.race.dice && !next.race.diceRolling) {
          next.race.diceRolling = true;
          next.race.log.unshift(`${p.name} がサイコロを振っています…`);
          await saveRoom(next);
        } else if (next.race.diceRolling) {
          const d = DICE[Math.floor(Math.random() * DICE.length)];
          next.race.dice = d.key;
          next.race.diceRolling = false;
          next.race.log.unshift(`${p.name} の出目：${d.icon} ${d.label}`);
          await saveRoom(next);
        } else {
          const horse = cpuChooseMove(next, p);
          if (!horse) return;
          doMoveHorse(next, horse);
          await saveRoom(next);
        }
      }
    };
    const p = room.phase === "betting" ? currentBetPlayer(room) : currentPlayer(room);
    if ((room.phase === "betting" || room.phase === "racing") && p?.type === "cpu") {
      cpuTimer = setTimeout(cpuAction, room.race?.diceRolling ? 850 : 700);
    }
  }

  function boardSpaces() {
    const coords = [];
    for (let c = 1; c <= 10; c++) coords.push([1, c]);
    for (let r = 2; r <= 10; r++) coords.push([r, 10]);
    for (let c = 9; c >= 1; c--) coords.push([10, c]);
    for (let r = 9; r >= 2; r--) coords.push([r, 1]);
    return coords.map((xy, i) => ({ no: i + 1, row: xy[0], col: xy[1] }));
  }

  function displayPosition(hid, fallback) {
    if (animationState && animationState.horse === hid) return animationState.pos;
    return fallback;
  }

  function maybeStartMoveAnimation() {
    const move = room?.race?.lastMove;
    if (!move?.ts || move.ts === lastAnimatedMoveTs) return;
    const path = Array.isArray(move.path) && move.path.length ? move.path : [move.finalTarget];
    lastAnimatedMoveTs = move.ts;
    clearTimeout(animationTimer);
    let idx = 0;
    const step = () => {
      if (!room?.race?.lastMove || room.race.lastMove.ts !== move.ts) {
        animationState = null;
        return;
      }
      if (idx < path.length) {
        animationState = { horse: move.horse, pos: path[idx], ts: move.ts };
        idx += 1;
        render();
        animationTimer = setTimeout(step, 190);
      } else {
        animationState = null;
        render();
      }
    };
    step();
  }

  function phaseText(phase) {
    return { lobby: "待機", betting: "賭け", racing: "レース", payout: "払い戻し", gameover: "終了" }[phase] || phase;
  }

  }

  function renderDiceVisual(diceKey, rolling) {
    if (rolling) {
      return `<div class="diceStage"><div class="diceCube rolling">🎲</div><div><div class="diceText">サイコロ回転中…</div><div class="diceFaces">🐎 🐎 🐎 🧢 🥕 ∪</div></div></div>`;
    }
    const d = diceKey ? diceObj(diceKey) : null;
    const icon = d ? (d.key === "shoe" ? "∪" : d.icon) : "🎲";
    return `<div class="diceStage"><div class="diceCube">${icon}</div><div><div class="diceText">${d ? `出目：${d.label}` : "サイコロ待ち"}</div><div class="diceFaces">🐎×3 / 🧢 / 🥕 / ∪</div></div></div>`;
  }

  function renderRaceHeader() {
    const dice = room.race.dice ? diceObj(room.race.dice) : null;
    const turn = room.phase === "betting" ? currentBetPlayer(room) : currentPlayer(room);
    const isMyRaceTurn = room.phase === "racing" && turn?.id === localId && turn?.type === "human";
    const raceControl = (() => {
      if (!isMyRaceTurn) return "";
      if (room.race.diceRolling) return `<span class="pill">🎲 回転中…</span>`;
      if (!room.race.dice) return `<button id="rollDice" class="good">🎲 サイコロを振る</button>`;
      return `<span class="pill">出目：${dice.icon} ${dice.label}。下の馬カードを選択</span>`;
    })();
    return `<section class="card">
      <div class="row between">
        <div><b>第${room.raceNo}レース</b> <span class="pill">${phaseText(room.phase)}</span></div>
        <div class="pill">手番：${escapeHtml(turn?.name || "-")}</div>
      </div>
      <div class="row" style="margin-top:8px">
        <span class="pill">ペース：${room.race.paceHorse ? horseDisplayName(room.race.paceHorse) : "未定"}</span>
        <span class="pill">3R倍率：${room.raceNo === 3 ? "2倍" : "通常"}</span>
        ${raceControl}
        <button id="toggleBgm" class="secondary">🎺 BGM ${bgmOn ? "OFF" : "ON"}</button>
        <button id="quitToTop" class="secondary">ゲームをやめる</button>
      </div>
      <div class="dicePanel">${renderDiceVisual(room.race.dice, room.race.diceRolling)}</div>
    </section>`;
  }

  function renderBetTurnPanel() {
    const p = currentBetPlayer(room);
    const chip = nextChip(room, p.id);
    if (p.id === localId && p.type === "human") {
      return `<section class="card"><b>あなたの賭け</b><div class="small">次のチップ：<b>${chip}</b>。下の馬カードをタップして賭けます。</div></section>`;
    }
    return `<section class="card"><b>${escapeHtml(p.name)} の賭け待ち</b><div class="small">CPUなら自動で進みます。</div></section>`;
  }

  function renderTrack() {
    const lastMove = room.race.lastMove || {};
    const placed = {};
    for (const hid of Object.keys(room.race.horses)) {
      const s = room.race.horses[hid];
      if (s.status === "finished") continue;
      const pos = Math.max(1, Math.min(GOAL_LINE, displayPosition(hid, s.pos)));
      placed[pos] ||= [];
      placed[pos].push(hid);
    }
    const spaces = boardSpaces();
    const finishOrder = room.race.finishOrder.map((hid, idx) => `${idx + 1}着 ${horseDisplayName(hid)}`).join(" / ") || "まだゴールなし";

    return `<section class="card">
      <div class="row between"><b>36マスコース</b><span class="small">36を超えたらゴール。同じマスには止まれないので、埋まっていたら戻ります。</span></div>
      ${lastMove.blocked ? `<div class="moveBanner">${horseDisplayName(lastMove.horse)}：${lastMove.rawTarget}マス目が埋まっていたため、${lastMove.finalTarget}マス目まで戻りました！</div>` : ""}
      <div class="sugorokuBoardWrap"><div class="sugorokuBoard">
        ${Array.from({ length: 100 }).map((_, idx) => {
          const row = Math.floor(idx / 10) + 1;
          const col = idx % 10 + 1;
          const sp = spaces.find(s => s.row === row && s.col === col);
          if (!sp) return `<div class="space empty"></div>`;
          const horses = placed[sp.no] || [];
          const cls = `space path ${sp.no <= 7 ? "start" : ""} ${sp.no === GOAL_LINE ? "finish" : ""} ${sp.no === PACE_SPACE ? "pace" : ""}`;
          return `<div class="${cls}"><div class="spaceNum">${sp.no}</div><div class="spaceLabel">${sp.no <= 7 ? "START" : sp.no === GOAL_LINE ? "GOAL" : sp.no === PACE_SPACE ? "PACE" : ""}</div><div class="spaceHorses">
            ${horses.map(hid => {
              const hi = horseInfo(hid);
              const c = horseCard(hid);
              const isLatest = lastMove.horse === hid;
              return `<span class="miniHorse ${isLatest ? "latest" : ""} ${isLatest && lastMove.blocked ? "blocked" : ""} ${animationState?.horse === hid ? "animating" : ""} ${c?.moved ? "moved" : ""}" style="--horse-color:${hi.color};" title="${hi.colorName} ${hi.label}">🐎</span>`;
            }).join("")}
          </div></div>`;
        }).join("")}
      </div></div>
      <div class="paddock" style="margin-top:8px"><b>ゴール</b> <span class="small">${finishOrder}</span></div>
      ${renderHorseCards()}
    </section>`;
  }

  function renderHorseCards() {
    const isBettingMine = room.phase === "betting" && currentBetPlayer(room)?.id === localId && currentBetPlayer(room)?.type === "human";
    const chip = isBettingMine ? nextChip(room, localId) : null;
    const used = isBettingMine ? alreadyBetHorses(room, localId) : new Set();
    const isRacingMine = room.phase === "racing" && currentPlayer(room)?.id === localId && currentPlayer(room)?.type === "human";
    const activeIds = isRacingMine && room.race.dice ? new Set(activeCards(clone(room)).map(c => c.horse)) : new Set();
    return `<div class="cardStrip">
      ${room.race.cards.map(c => {
        const h = horseInfo(c.horse);
        const state = room.race.horses[c.horse];
        const shownPos = state.status === "finished" ? GOAL_LINE : state.pos;
        const need = state.status === "finished" ? "ゴール済" : `現在${shownPos} / あと${Math.max(1, GOAL_LINE - shownPos + 1)}マス以上`;
        const canBet = isBettingMine && !used.has(c.horse);
        const canMove = isRacingMine && room.race.dice && activeIds.has(c.horse);
        const bets = room.race.bets.filter(b => b.horse === c.horse);
        return `<div class="horseCard ${c.moved ? "moved" : ""} ${canBet ? "clickable betCard" : ""} ${canMove ? "clickable moveCard" : ""} ${used.has(c.horse) ? "selectedCard" : ""}" data-horse="${c.horse}">
          <div class="horseCardHeader">
            <b class="horseName"><span class="miniHorse" style="--horse-color:${h.color};">🐎</span> ${h.colorName} ${c.name}</b>
            ${moodBadge(c.mood)}
          </div>
          <div class="tiny">テンション：${MOOD[c.mood].face} ${MOOD[c.mood].label} / ${need}</div>
          <div class="moveNums"><span>${face("horse")}${c.moves.horse}</span><span>${face("cap")}${c.moves.cap}</span><span>${face("carrot")}${c.moves.carrot}</span><span>${face("shoe")}${c.moves.shoe}</span><span>平均${averageMove(c.moves)}</span></div>
          <div class="betMini">${bets.length ? bets.map(b => {
            const p = room.players.find(x => x.id === b.playerId);
            return `<span class="pill"><b style="color:${p?.color || "#333"}">${escapeHtml(p?.name || "?")}</b> ${b.chip}</span>`;
          }).join("") : `<span class="small">賭けなし</span>`}</div>
          ${canBet ? `<button class="good betOnCardBtn" data-horse="${c.horse}" style="margin-top:8px;width:100%;">この馬に${chip}チップ</button>` : ""}
          ${canMove ? `<button class="good moveOnCardBtn" data-horse="${c.horse}" style="margin-top:8px;width:100%;">この馬を進める +${c.moves[room.race.dice]}</button>` : ""}
        </div>`;
      }).join("")}
    </div>`;
  }

  function renderBets() {
    return `<section class="card">
      <div class="row between"><b>賭け状況</b><span class="small">誰が何に何チップ賭けたか</span></div>
      <div class="betList">
        ${room.players.map(p => {
          const bets = room.race.bets.filter(b => b.playerId === p.id);
          return `<div class="betPlayer"><div class="row between"><b style="color:${p.color}">${escapeHtml(p.name)}</b><span class="small">合計${bets.reduce((s,b)=>s+b.chip,0)}チップ</span></div>
            <div class="betMini">${bets.length ? bets.map(b => {
              const h = horseInfo(b.horse);
              return `<span class="pill"><span class="miniHorse" style="--horse-color:${h.color};">🐎</span>${h.colorName}${h.label}：<b>${b.chip}</b></span>`;
            }).join("") : `<span class="small">まだ賭けなし</span>`}</div>
          </div>`;
        }).join("")}
      </div>
      <div class="betArea" style="margin-top:8px">
        ${HORSES.map(h => {
          const bets = room.race.bets.filter(b => b.horse === h.id);
          const total = bets.reduce((s, b) => s + b.chip, 0);
          return `<div class="horseBet"><div class="row between"><b><span class="miniHorse" style="--horse-color:${h.color};">🐎</span> ${h.colorName} ${h.label}</b><span class="pill">${total}票</span></div><div class="chips">${bets.map(b => {
            const p = room.players.find(x => x.id === b.playerId);
            return `<span title="${escapeHtml(p?.name || "")}" class="chip" style="border-color:${p?.color || "#333"};">${b.chip}</span>`;
          }).join("")}</div></div>`;
        }).join("")}
      </div>
    </section>`;
  }

  function renderActionPanel() {
    if (room.phase === "payout") return `<section class="actions"><div class="primaryActionRow"><button id="nextRace" class="good" ${!isHost() ? "disabled" : ""}>次のレースへ</button><button id="quitToTop" class="secondary">ゲームをやめる</button></div></section>`;
    if (room.phase === "gameover") return `<section class="actions"><div class="primaryActionRow"><button id="backToLobby" ${!isHost() ? "disabled" : ""}>ロビーに戻る</button><button id="quitToTop" class="secondary">ゲームをやめる</button></div></section>`;
    return "";
  }

  function renderRaceAction(quitBtn) {
    const p = currentPlayer(room);
    if (p.id !== localId) return `<section class="actions"><div class="primaryActionRow"><span class="stickyDiceMini"><span class="stickyDiceIcon">${room.race.dice ? diceObj(room.race.dice).icon : room.race.diceRolling ? "🎲" : "⏳"}</span>${room.race.dice ? diceObj(room.race.dice).label : room.race.diceRolling ? "回転中" : "待機"}</span><b>${escapeHtml(p.name)}の手番待ち</b>${quitBtn}</div><div class="small">CPUなら自動で進みます。</div></section>`;
    if (room.race.diceRolling) return `<section class="actions"><div class="primaryActionRow"><span class="stickyDiceMini"><span class="stickyDiceIcon">🎲</span>回転中…</span>${quitBtn}</div><div class="small">出目が決まるまで少し待ってください。</div></section>`;
    if (!room.race.dice) return `<section class="actions"><div class="primaryActionRow"><button id="rollDice" class="good">🎲 サイコロを振る</button>${quitBtn}</div></section>`;
    const dice = diceObj(room.race.dice);
    const cards = activeCards(clone(room));
    return `<section class="actions"><div class="primaryActionRow"><span class="stickyDiceMini"><span class="stickyDiceIcon">${dice.icon}</span>出目：${dice.label}</span>${quitBtn}</div><div class="row" style="margin-top:8px">${cards.map(c => {
      const h = horseInfo(c.horse);
      return `<button class="moveHorseBtn" data-horse="${c.horse}">${h.colorName}${c.name} +${c.moves[room.race.dice]}</button>`;
    }).join("")}</div></section>`;
  }

  function renderPayout() {
    if (!room.race?.payout) return "";
    const order = room.race.finishOrder.map((hid, idx) => `${idx + 1}着 ${horseDisplayName(hid)}`).join(" / ");
    const last = room.race.lastHorse ? horseDisplayName(room.race.lastHorse) : "-";
    const winner = [...room.players].sort((a, b) => b.money - a.money)[0];
    return `<section class="card"><b>${room.phase === "gameover" ? "最終結果" : "払い戻し"}</b><div class="row" style="margin-top:8px"><span class="pill">${order}</span><span class="pill">最下位 ${last}</span><span class="pill">倍率 ${room.race.payout.multiplier}倍</span></div><div class="grid" style="margin-top:10px">${room.race.payout.playerResults.map(res => `<div class="playerBox"><div class="row between"><b>${escapeHtml(res.name)}</b><span class="money">${res.net >= 0 ? "+" : ""}${res.net} → ¥${res.after}</span></div><div class="tiny">${res.details.length ? escapeHtml(res.details.join(" / ")) : "的中・支払いなし"}</div></div>`).join("")}</div>${room.phase === "gameover" ? `<div class="card" style="box-shadow:none;background:#fff;"><span class="rank">🏆</span> 優勝：<b>${escapeHtml(winner.name)}</b> ¥${winner.money}</div>` : ""}</section>`;
  }

  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  }
  function playNote(freq, start, duration, type = "square", gain = 0.05) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(gain, start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + duration + 0.02);
  }
  function playEffect(kind) {
    if (!bgmOn) return;
    ensureAudio();
    const t = audioCtx.currentTime;
    if (kind === "dice") [420, 520, 630, 760].forEach((f, i) => playNote(f, t + i * 0.07, 0.06, "triangle", 0.035));
    else [330, 392, 494].forEach((f, i) => playNote(f, t + i * 0.05, 0.07, "square", 0.035));
  }
  function bgmTick() {
    if (!bgmOn) return;
    ensureAudio();
    const t = audioCtx.currentTime;
    const melody = [523, 659, 784, 659, 698, 880, 784, 659, 523, 659, 784, 988, 880, 784, 659, 587];
    const bass = [196, 196, 220, 220, 196, 196, 247, 247];
    for (let i = 0; i < 4; i++) {
      playNote(melody[(bgmStep + i) % melody.length], t + i * 0.18, 0.14, "square", 0.025);
      if (i % 2 === 0) playNote(bass[Math.floor((bgmStep + i) / 2) % bass.length], t + i * 0.18, 0.16, "triangle", 0.018);
    }
    bgmStep = (bgmStep + 4) % melody.length;
  }
  function startBgm() {
    ensureAudio();
    bgmOn = true;
    bgmTick();
    clearInterval(bgmTimer);
    bgmTimer = setInterval(bgmTick, 720);
    render();
  }
  function stopBgm() {
    bgmOn = false;
    clearInterval(bgmTimer);
    render();
  }
  function toggleBgm() { bgmOn ? stopBgm() : startBgm(); }

  function bindEvents() {
    document.getElementById("createRoom")?.addEventListener("click", createRoom);
    document.getElementById("joinRoom")?.addEventListener("click", joinRoom);
    document.getElementById("addCpu")?.addEventListener("click", addCpu);
    document.getElementById("startGame")?.addEventListener("click", startGame);
    document.getElementById("rollDice")?.addEventListener("click", rollDice);
    document.getElementById("nextRace")?.addEventListener("click", nextRace);
    document.getElementById("backToLobby")?.addEventListener("click", backToLobby);
    document.getElementById("quitToTop")?.addEventListener("click", quitToTop);
    document.querySelectorAll("#toggleBgm").forEach(btn => btn.addEventListener("click", toggleBgm));
    document.querySelectorAll(".betCard, .betOnCardBtn").forEach(el => el.addEventListener("click", e => {
      e.stopPropagation();
      placeBet(el.dataset.horse);
    }));
    document.querySelectorAll(".moveCard, .moveOnCardBtn, .moveHorseBtn").forEach(el => el.addEventListener("click", e => {
      e.stopPropagation();
      moveHorse(el.dataset.horse);
    }));
  }

  await initFirebase().catch(err => {
    console.warn("Firebase init failed", err);
    online = false;
  });
  if (roomCode) await openRoom(roomCode);
  render();
</script>
</body>
</html>
