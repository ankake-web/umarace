<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>うまうまレース</title>
<!-- umauma-race v27 compact rectangle course / 3-column cards / hidden mood -->
<style>
:root{--ink:#3b2a1b;--muted:#806f61;--line:#ead8bc;--shadow:0 12px 26px rgba(91,55,22,.14)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 6%,#fff,transparent 24%),radial-gradient(circle at 90% 10%,#ffd1dc,transparent 28%),linear-gradient(135deg,#fff7e8,#ffe8ef 48%,#e7f8de);min-height:100vh}
button,input,select{font:inherit}
button{border:0;border-radius:999px;padding:10px 14px;background:linear-gradient(180deg,#9b6534,#774418);color:#fff;font-weight:900;box-shadow:0 5px 12px rgba(74,42,18,.18)}
button.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.good{background:linear-gradient(180deg,#40bd75,#198754)}
button:disabled{opacity:.45;box-shadow:none}
input,select{width:100%;border:1px solid var(--line);border-radius:16px;padding:12px 13px;background:#fff;color:var(--ink)}
.app{max-width:980px;margin:0 auto;padding:10px 10px 132px}
.hero{margin-bottom:10px;padding:13px 16px;border-radius:26px;background:linear-gradient(135deg,#ffb7c5,#ffd996 48%,#8bd98b);border:2px solid rgba(255,255,255,.75);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"🐴";position:absolute;right:14px;top:-10px;font-size:64px;opacity:.25;transform:rotate(-8deg)}
h1{margin:0;font-size:24px;letter-spacing:.04em;text-shadow:0 2px 0 rgba(255,255,255,.5)}
.grid{display:grid;gap:10px}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:rgba(255,253,247,.96);border:1px solid rgba(234,216,188,.96);border-radius:22px;padding:13px;margin-top:12px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.small{font-size:12px;color:var(--muted)}
.tiny{font-size:11px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900}
.money{font-variant-numeric:tabular-nums;font-weight:950}
.current{outline:3px solid rgba(255,159,189,.45)}
.playerBox{background:#fff;border:1px solid var(--line);border-radius:17px;padding:10px}
.chip{min-width:28px;height:28px;border-radius:999px;border:2px solid #444;display:inline-grid;place-items:center;font-size:12px;font-weight:950;background:#fff;color:#222}

.homeHero{padding:18px;border-radius:32px;background:radial-gradient(circle at 18% 18%,rgba(255,255,255,.95),transparent 25%),radial-gradient(circle at 86% 24%,#ffeeb3,transparent 30%),linear-gradient(135deg,#ffb7c5,#ffd996 47%,#8bd98b);box-shadow:var(--shadow);position:relative;overflow:hidden;min-height:165px;border:2px solid rgba(255,255,255,.82)}
.homeHero:before{content:"";position:absolute;left:-35px;right:-35px;bottom:-88px;height:128px;border:18px solid rgba(255,255,255,.32);border-top:0;border-radius:0 0 50% 50%;transform:rotate(-5deg)}
.homeHero:after{content:"🐴";position:absolute;right:6px;bottom:-14px;font-size:104px;opacity:.38;filter:drop-shadow(0 8px 12px rgba(91,55,22,.18));transform:rotate(-8deg)}
.homeCopy{position:relative;z-index:2}
.homeTitle{font-size:clamp(34px,8vw,56px);font-weight:950;letter-spacing:.04em;line-height:1.02;margin:0;text-shadow:0 3px 0 rgba(255,255,255,.58)}
.homeLead{max-width:650px;margin-top:10px;font-weight:850;font-size:14px;line-height:1.55;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.homePanel{margin-top:12px;display:grid;grid-template-columns:1fr;gap:12px}
.homeForm,.homeHow{background:rgba(255,253,247,.96);border:1px solid rgba(234,216,188,.96);border-radius:24px;padding:14px;box-shadow:var(--shadow)}
.ruleBlock{display:grid;gap:9px;margin-top:10px}
.ruleItem{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;line-height:1.55}
.ruleItem b{display:block;margin-bottom:3px;color:#5c381b}
.payout{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.payout th,.payout td{border:1px solid #eadcc8;padding:5px 6px;text-align:center;background:#fff}
.payout th{background:#fff2d6}
.homeTip{margin-top:10px;padding:10px;border-radius:15px;background:#fff7d6;border:1px solid #e3c765;font-size:12px;font-weight:850}

.scoreGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mood{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:950;border:1px solid rgba(0,0,0,.08)}
.moodGood{background:#ffe0d3;color:#9e2b14}
.moodNormal{background:#e8f5e9;color:#1b5e20}
.moodBad{background:#e3f2fd;color:#0d47a1}

.dicePanel{margin-top:10px;display:flex;justify-content:center}
.diceStage{display:inline-flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px 14px;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.diceCube{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#fff,#f5f5f5 45%,#d9d9d9);border:3px solid #3b2a1b;font-size:30px;box-shadow:0 8px 0 #b8b8b8,0 12px 16px rgba(0,0,0,.22);transform:rotate(-5deg)}
.diceCube.rolling{animation:diceShake .12s infinite alternate,diceSpin .6s infinite linear}
.diceText{font-size:13px;font-weight:950}
.diceFaces{color:var(--muted);font-size:12px}
@keyframes diceShake{from{translate:-3px -2px}to{translate:3px 2px}}
@keyframes diceSpin{from{rotate:0deg}to{rotate:360deg}}

.trackBoard{position:relative;margin-top:10px;aspect-ratio:2.45;border-radius:22px;background:linear-gradient(180deg,#5eb56b,#17723c);border:5px solid #9a6330;box-shadow:inset 0 0 0 3px rgba(255,255,255,.22),var(--shadow);overflow:hidden}
.trackBoard:before{content:"";position:absolute;inset:17% 8%;border-radius:18px;border:11px solid rgba(229,195,132,.92);background:linear-gradient(180deg,#2e8b4b,#146a34);box-shadow:inset 0 0 0 3px rgba(255,255,255,.26)}
.trackBoard:after{content:"";position:absolute;inset:36% 29%;border-radius:14px;background:linear-gradient(180deg,#2b8448,#0f6330);border:2px solid rgba(255,255,255,.28)}
.trackSpace{position:absolute;width:8.1%;height:13.2%;transform:translate(-50%,-50%);border-radius:6px;background:linear-gradient(180deg,#ffe0a5,#d7a05b);border:1px solid rgba(77,45,18,.42);box-shadow:inset 0 2px 0 rgba(255,255,255,.36);z-index:2}
.trackSpace.finish{background:linear-gradient(180deg,#fff07a,#dba020)}
.trackSpace.pace{outline:2px solid #fff178}
.num{position:absolute;left:2px;top:1px;font-size:7px;font-weight:950;color:rgba(49,35,20,.72);z-index:2}
.lab{position:absolute;right:2px;bottom:1px;font-size:6px;font-weight:950;color:rgba(49,35,20,.72);z-index:2}
.slot{position:absolute;inset:9px 1px 1px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:1px;z-index:4}
.pony{width:16px;height:16px;display:grid;place-items:center;border-radius:999px;background:#fff;border:2px solid var(--horse-color);box-shadow:0 3px 8px rgba(0,0,0,.2);font-size:10px;transition:transform .18s ease}
.pony.anim{transform:scale(1.18);box-shadow:0 0 0 4px rgba(255,235,59,.7),0 6px 12px rgba(0,0,0,.24)}
.pony.latest{animation:horseHop .8s ease both}
.pony.blocked{animation:blockedBounce .95s ease both}
@keyframes horseHop{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-10px) scale(1.15)}70%{transform:translateY(1px) scale(.98)}100%{transform:translateY(0) scale(1)}}
@keyframes blockedBounce{0%{transform:translateX(0) scale(1)}25%{transform:translateX(12px) translateY(-5px) scale(1.12)}55%{transform:translateX(-8px) scale(.98)}80%{transform:translateX(3px)}100%{transform:translateX(0) scale(1)}}

.centerInfo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;background:rgba(255,253,247,.96);border:1px solid var(--line);border-radius:14px;padding:7px 9px;box-shadow:0 5px 14px rgba(0,0,0,.12);font-size:13px;line-height:1.34;width:52%;max-width:340px}
.centerInfo b{display:block;text-align:center;margin-bottom:4px;font-size:13px}
.centerList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 6px}
.moveLine{font-size:12px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.waitLine{text-align:center;font-size:14px;font-weight:950}
.moveBanner{margin-top:8px;padding:8px 10px;border-radius:14px;background:#fff7d6;border:1px solid #e3c765;font-size:12px;font-weight:850}

.cardStrip{margin-top:10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.horseGrid{margin-top:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.horseCard{background:linear-gradient(180deg,#fff,#fffaf0);border:1px solid var(--line);border-radius:18px;padding:9px;font-size:12px;transition:transform .15s,box-shadow .15s,outline .15s}
.horseCard.clickable{cursor:pointer}
.horseCard.clickable:active{transform:scale(.98)}
.horseCard.selected{outline:3px solid rgba(255,159,189,.55);box-shadow:0 8px 18px rgba(255,159,189,.2)}
.horseCard.moved{opacity:.55}
.horseHead{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.horseName{font-weight:950;font-size:13px}
.moves{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.moves span{background:#fff2d6;border-radius:999px;padding:3px 6px;font-size:11px;font-weight:850}
.betMini{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;min-height:20px;align-content:flex-start}
.betMini .pill{font-size:10px;padding:3px 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cardStrip .horseCard{padding:7px;min-height:72px}
.cardStrip .horseName{font-size:11px;line-height:1.15}
.cardStrip .horseHead .pony{width:16px;height:16px;font-size:10px;flex:0 0 auto}
.cardStrip .tiny,.cardStrip .moves,.cardStrip .mood,.cardStrip .actionSlot{display:none!important}

.actions{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10;width:min(980px,calc(100vw - 16px));background:rgba(255,253,247,.96);border:1px solid var(--line);border-radius:24px;padding:10px;box-shadow:var(--shadow);backdrop-filter:blur(8px);animation:fadeUp .45s ease both}
@keyframes fadeUp{from{opacity:0;transform:translate(-50%,18px)}to{opacity:1;transform:translate(-50%,0)}}
.primaryActionRow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.primaryActionRow button{flex:1 1 auto}
.log{max-height:150px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px}
.log div{padding:4px 0;border-bottom:1px dashed #eee;font-size:12px}
.rank{font-size:24px;font-weight:950}

@media(max-width:560px){
.homePanel,.two,.scoreGrid{grid-template-columns:1fr}
.horseGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.cardStrip{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.homeHero{min-height:150px}
.homeTitle{font-size:36px}
.homeLead{font-size:13px;max-width:72%}
.app{padding:8px 8px 132px}
.actions{border-radius:18px}
.trackBoard{aspect-ratio:2.75;border-width:4px;border-radius:16px}
.trackBoard:before{inset:15% 6%;border-width:8px;border-radius:14px}
.trackBoard:after{inset:36% 28%;border-radius:12px}
.trackSpace{width:8.4%;height:13.8%;border-radius:5px}
.num{font-size:6px}
.lab{font-size:5px}
.pony{width:13px;height:13px;font-size:8px;border-width:2px}
.slot{inset:7px 1px 1px}
.horseCard{padding:7px}
.horseName{font-size:12px}
.moves span{font-size:10px;padding:2px 5px}
.cardStrip .horseCard{padding:6px;min-height:66px;border-radius:14px}
.cardStrip .horseName{font-size:10px}
.cardStrip .horseHead .pony{width:13px;height:13px;font-size:8px}
.betMini .pill{font-size:9px;padding:2px 4px}
.mood{padding:4px 6px}
.moodText{display:none}
.centerInfo{font-size:10px;padding:5px 6px;width:54%;border-radius:11px}
.centerInfo b{font-size:10px;margin-bottom:2px}
.centerList{gap:1px 4px}
.moveLine{font-size:9.5px;line-height:1.25}
.waitLine{font-size:11px}
}
</style>
</head>
<body>
<div id="app" class="app"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import{getFirestore,doc,setDoc,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyCxHux7rE19LCvV-2sNwhEMtGABf3tZgDs",
authDomain:"umauma-737d6.firebaseapp.com",
projectId:"umauma-737d6",
storageBucket:"umauma-737d6.firebasestorage.app",
messagingSenderId:"704545420057",
appId:"1:704545420057:web:9fa4081aa62dc5900d4b88",
measurementId:"G-0E7DM5B4VB"
};

const GAME_TITLE="うまうまレース";
const MAX_PLAYERS=6,GOAL_LINE=36,PACE_SPACE=22;
const FACE={horse:"🐎",cap:"🧢",carrot:"🥕",weather:"☀️"};
const DICE=[
{key:"horse",label:"馬",icon:"🐎"},
{key:"horse",label:"馬",icon:"🐎"},
{key:"horse",label:"馬",icon:"🐎"},
{key:"cap",label:"ジョッキー",icon:"🧢"},
{key:"carrot",label:"人参",icon:"🥕"},
{key:"weather",label:"天候",icon:"☀️"}
];
const HORSES=[
{id:"red",label:"レッドインパクト",short:"レッド",base:{horse:2,cap:12,carrot:5,weather:7},color:"#e53935"},
{id:"black",label:"コタサンブラック",short:"コタ",base:{horse:7,cap:2,carrot:4,weather:3},color:"#222"},
{id:"pink",label:"オグリピンク",short:"オグリ",base:{horse:4,cap:3,carrot:12,weather:3},color:"#f78ac3"},
{id:"yellow",label:"イエローアイ",short:"イエロ",base:{horse:3,cap:10,carrot:8,weather:3},color:"#f2c94c"},
{id:"green",label:"グリーンテイオー",short:"グリン",base:{horse:4,cap:11,carrot:1,weather:6},color:"#27ae60"},
{id:"white",label:"シロイロックス",short:"シロイ",base:{horse:5,cap:8,carrot:2,weather:5},color:"#f8f8f8"},
{id:"blue",label:"オルフェーブルー",short:"オルフ",base:{horse:1,cap:14,carrot:1,weather:12},color:"#2f80ed"}
];
const MOOD={
good:{label:"好調",face:"😄",delta:0,className:"moodGood"},
normal:{label:"普通",face:"🙂",delta:3,className:"moodNormal"},
bad:{label:"不調",face:"😣",delta:6,className:"moodBad"}
};
const PAYOUT_TABLE={1:[500,350,250,200,150],2:[350,250,200,150,100],3:[250,200,150,100,100]};
const PLAYER_COLORS=["#e53935","#1e88e5","#43a047","#8e24aa","#fb8c00","#546e7a"];
const CPU_NAMES=["ルメ","ユタ","ノリ","川田","ミル"];

let appEl=document.getElementById("app");
let localId=localStorage.getItem("umaRacePlayerId")||crypto.randomUUID();
localStorage.setItem("umaRacePlayerId",localId);
let localName=localStorage.getItem("umaRacePlayerName")||"";
let roomCode=new URL(location.href).hash.replace("#","").trim().toUpperCase();
let room=null,db=null,online=false,roomRef=null,unsubscribe=null;
let cpuTimer=null,animationState=null,animationTimer=null,lastAnimatedMoveTs=null;
let audioCtx=null,bgmOn=false,bgmTimer=null,bgmStep=0;

async function initFirebase(){
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
await signInAnonymously(auth);
db=getFirestore(app);
online=true;
}
const clone=x=>JSON.parse(JSON.stringify(x));
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const randomCode=()=>Math.random().toString(36).slice(2,6).toUpperCase();
const horseInfo=id=>HORSES.find(h=>h.id===id);
const currentPlayer=(r=room)=>r.players[r.turnIndex%r.players.length];
const currentBetPlayer=(r=room)=>r.players[(r.starterIndex+r.race.bets.length)%r.players.length];
const chipsForRule=()=>[2,1,1];
const diceObj=key=>DICE.find(d=>d.key===key);
const isHost=()=>room?.hostId===localId;
const escapeHtml=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const face=key=>FACE[key]||key;
const effectiveTotal=m=>m.horse*3+m.cap+m.carrot+m.weather;
const averageMove=m=>(effectiveTotal(m)/6).toFixed(1);
const horseDisplayName=hid=>horseInfo(hid)?.label||hid;
const horseShort=hid=>horseInfo(hid)?.short||hid;
const horseCard=(hid,r=room)=>r?.race?.cards?.find(c=>c.horse===hid);

function cpuConfig(r=room){
const level=r?.settings?.cpuLevel||"normal";
if(level==="weak")return{skill:.45,random:34};
if(level==="strong")return{skill:1.35,random:5};
return{skill:1,random:12};
}
function cpuDelay(){return 2100+Math.random()*900}

function reduceStats(base,delta){
const stats=clone(base);let rem=delta,guard=0;
while(rem>0&&guard<200){
guard++;
const actions=[];
if(rem>=3&&stats.horse>1)actions.push({key:"horse",cost:3,weight:2});
for(const k of["cap","carrot","weather"]){if(stats[k]>1)actions.push({key:k,cost:1,weight:3})}
const avail=actions.filter(a=>a.cost<=rem);
if(!avail.length)break;
const pool=[];
avail.forEach(a=>{for(let i=0;i<a.weight;i++)pool.push(a)});
const p=pool[Math.floor(Math.random()*pool.length)];
stats[p.key]-=1;
rem-=p.cost;
}
return stats;
}
function makeRaceCards(){
const moods=["good","normal","bad"];
return HORSES.map(h=>{
const mood=moods[Math.floor(Math.random()*moods.length)];
const moves=reduceStats(h.base,MOOD[mood].delta);
return{horse:h.id,name:h.label,mood,moves,expected:Number(averageMove(moves)),id:crypto.randomUUID(),moved:false};
});
}

async function saveRoom(next){
room=next;
if(online&&roomCode){await setDoc(roomRef,next)}
else{localStorage.setItem("umaRaceLocalRoom",JSON.stringify(next));maybeStartMoveAnimation();render();maybeRunCpu()}
}
async function createRoom(){
localName=(document.getElementById("playerName")?.value||"名無").trim().slice(0,3);
localStorage.setItem("umaRacePlayerName",localName);
roomCode=(document.getElementById("roomCode")?.value||randomCode()).trim().toUpperCase();
history.replaceState(null,"","#"+roomCode);
const base={version:27,title:GAME_TITLE,code:roomCode,hostId:localId,phase:"lobby",raceNo:0,turnIndex:0,starterIndex:0,settings:{cpuLevel:"normal"},players:[{id:localId,name:localName,type:"human",color:PLAYER_COLORS[0],money:0,seat:0}],race:null,createdAt:Date.now(),updatedAt:Date.now()};
await openRoom(roomCode);
await saveRoom(base);
}
async function joinRoom(){
localName=(document.getElementById("playerName")?.value||"名無").trim().slice(0,3);
localStorage.setItem("umaRacePlayerName",localName);
roomCode=(document.getElementById("roomCode")?.value||roomCode||"").trim().toUpperCase();
if(!roomCode)return alert("部屋番号を入れてください");
history.replaceState(null,"","#"+roomCode);
await openRoom(roomCode);
}
async function openRoom(code){
roomCode=code;
if(unsubscribe)unsubscribe();
if(online){
roomRef=doc(db,"rooms",roomCode);
unsubscribe=onSnapshot(roomRef,async snap=>{
if(!snap.exists()){room=null;render();return}
room=snap.data();
room.settings=room.settings||{cpuLevel:"normal"};
await maybeJoinAsHuman();
maybeStartMoveAnimation();
render();
maybeRunCpu();
});
}else{
const saved=localStorage.getItem("umaRaceLocalRoom");
room=saved?JSON.parse(saved):null;
if(room)room.settings=room.settings||{cpuLevel:"normal"};
render();
maybeRunCpu();
}
}
async function maybeJoinAsHuman(){
if(!room||room.phase!=="lobby"||room.players.some(p=>p.id===localId)||room.players.length>=MAX_PLAYERS)return;
const next=clone(room);
next.players.push({id:localId,name:localName||"名無",type:"human",color:PLAYER_COLORS[next.players.length],money:0,seat:next.players.length});
next.updatedAt=Date.now();
await saveRoom(next);
}
async function addCpu(){
if(!isHost()||!room||room.players.length>=MAX_PLAYERS)return;
const next=clone(room);
const n=next.players.filter(p=>p.type==="cpu").length;
if(n>=5)return;
next.players.push({id:"cpu-"+crypto.randomUUID(),name:CPU_NAMES[n]||"CPU",type:"cpu",color:PLAYER_COLORS[next.players.length],money:0,seat:next.players.length});
await saveRoom(next);
}
async function removeCpu(){
if(!isHost()||!room||room.phase!=="lobby")return;
const next=clone(room);
const idx=[...next.players].map((p,i)=>({p,i})).reverse().find(x=>x.p.type==="cpu")?.i;
if(idx===undefined)return;
next.players.splice(idx,1);

function doMoveHorse(r,horseId){
const p=currentPlayer(r);
const diceKey=r.race.dice;
const card=r.race.cards.find(c=>c.horse===horseId);
if(!card||card.moved||r.race.horses[horseId].status!=="running")return;
const move=Number(card.moves[diceKey]||0);
const h=r.race.horses[horseId];
const before=h.pos;
const rawTarget=before+move;
const forwardPath=[];
for(let s=before+1;s<=Math.min(rawTarget,GOAL_LINE);s++)forwardPath.push(s);
if(!r.race.paceHorse&&rawTarget>=PACE_SPACE){
r.race.paceHorse=horseId;
r.race.log.unshift(`${horseDisplayName(horseId)} がペースホース！`);
}
if(rawTarget>GOAL_LINE){
h.status="finished";
h.rank=r.race.finishOrder.length+1;
h.pos=GOAL_LINE+h.rank;
r.race.finishOrder.push(horseId);
card.moved=true;
r.race.lastMove={horse:horseId,from:before,rawTarget,finalTarget:h.pos,blocked:false,path:[...forwardPath,GOAL_LINE],ts:Date.now()};
r.race.log.unshift(`${p.name} が ${horseDisplayName(horseId)} を${move}進め、${h.rank}着でゴール！`);
}else{
const occupied=new Set(Object.entries(r.race.horses).filter(([hid,s])=>hid!==horseId&&s.status==="running").map(([_,s])=>s.pos));
let target=rawTarget;
while(target>before&&occupied.has(target))target--;
const blocked=target<rawTarget;
const path=[...forwardPath];
if(blocked){for(let s=Math.min(rawTarget,GOAL_LINE)-1;s>=target;s--)path.push(s)}
h.pos=target;
card.moved=true;
r.race.lastMove={horse:horseId,from:before,rawTarget,finalTarget:target,blocked,path,ts:Date.now()};
r.race.log.unshift(blocked?`${p.name} が ${horseDisplayName(horseId)} を${rawTarget}まで進めようとしましたが、埋まっていたため${target}まで戻りました。`:`${p.name} が ${horseDisplayName(horseId)} を ${before} → ${target} に進めました。`);
}
if(r.race.finishOrder.length>=3){finishRace(r);return}
activeCards(r);
r.turnIndex=(r.turnIndex+1)%r.players.length;
r.race.dice=null;
r.race.diceRolling=false;
}
function finishRace(r){
const running=Object.entries(r.race.horses).filter(([_,s])=>s.status==="running");
running.sort((a,b)=>a[1].pos-b[1].pos);
const last=running[0]?.[0]||null;
r.race.lastHorse=last;
if(last)r.race.horses[last].rank=7;
r.race.payout=calculatePayout(r);
r.phase=r.raceNo>=3?"gameover":"payout";
r.race.log.unshift(`第${r.raceNo}レース終了。払い戻しを計算しました。`);
}
function calculatePayout(r){
const mult=r.raceNo===3?2:1;
const totals={};
HORSES.forEach(h=>totals[h.id]=0);
for(const b of r.race.bets)totals[b.horse]+=b.chip;
const results=r.players.map(p=>({playerId:p.id,name:p.name,before:p.money,gain:0,loss:0,details:[]}));
const resOf=pid=>results.find(x=>x.playerId===pid);
for(const b of r.race.bets){
const res=resOf(b.playerId);
const rankIndex=r.race.finishOrder.indexOf(b.horse);
if(rankIndex>=0&&rankIndex<3){
const rank=rankIndex+1;
const total=Math.max(1,totals[b.horse]);
const col=Math.min(total,5)-1;
let amount=PAYOUT_TABLE[rank][col]*b.chip;
if(r.race.paceHorse===b.horse)amount+=100*b.chip;
amount*=mult;
res.gain+=amount;
res.details.push(`${horseDisplayName(b.horse)} ${rank}着 +${amount}`);
}
if(r.race.lastHorse===b.horse){
const amount=100*b.chip*mult;
res.loss+=amount;
res.details.push(`${horseDisplayName(b.horse)} 最下位 -${amount}`);
}
}
for(const res of results){
const p=r.players.find(p=>p.id===res.playerId);
p.money+=res.gain;
const payable=Math.min(p.money,res.loss);
p.money-=payable;
res.loss=payable;
res.after=p.money;
res.net=res.after-res.before;
}
return{multiplier:mult,horseTotals:totals,playerResults:results};
}

function cpuChooseBet(r,cpu){
const cfg=cpuConfig(r);
const used=alreadyBetHorses(r,cpu.id),chip=nextChip(r,cpu.id);
const opts=r.race.cards.filter(c=>!used.has(c.horse)).map(c=>{
const s=r.race.horses[c.horse];
const pop=r.race.bets.filter(b=>b.horse===c.horse).reduce((a,b)=>a+b.chip,0);
const mood=c.mood==="good"?8:c.mood==="normal"?3:-4;
const base=s.pos*1.3+c.expected*3+mood-pop*2;
return{horse:c.horse,score:base*cfg.skill+Math.random()*cfg.random};
}).sort((a,b)=>b.score-a.score);
return{chip,horse:opts[0].horse};
}
function cpuChooseMove(r,cpu){
if(!r.race.dice)return null;
const cfg=cpuConfig(r);
const cards=activeCards(r);
const own=Object.fromEntries(r.race.bets.filter(b=>b.playerId===cpu.id).map(b=>[b.horse,b.chip]));
const opts=cards.map(c=>{
const move=Number(c.moves[r.race.dice]||0);
const pos=r.race.horses[c.horse].pos;
const ownChip=own[c.horse]||0;
const others=r.race.bets.filter(b=>b.horse===c.horse&&b.playerId!==cpu.id).reduce((a,b)=>a+b.chip,0);
let base=move*4+ownChip*38-others*8;
if(ownChip&&pos+move>=PACE_SPACE&&!r.race.paceHorse)base+=25;
if(ownChip&&pos+move>GOAL_LINE)base+=100;
if(!ownChip&&pos+move>GOAL_LINE)base-=35;
return{horse:c.horse,score:base*cfg.skill+Math.random()*cfg.random};
}).sort((a,b)=>b.score-a.score);
return opts[0]?.horse;
}

function renderBetTurnPanel(){
const p=currentBetPlayer(room),chip=nextChip(room,p.id);
return p.id===localId&&p.type==="human"?`<section class="card"><b>あなたのBET</b><div class="small">次のチップ：<b>${chip}</b>。下の馬カードをタップ。</div></section>`:`<section class="card"><b>${escapeHtml(p.name)} のBET待ち</b><div class="small">CPUなら自動で進みます。</div></section>`;
}
function renderCenter(){
if(room.race.diceRolling)return`<div class="centerInfo"><div class="waitLine">🎲 回転中…</div></div>`;
if(!room.race.dice)return`<div class="centerInfo"><div class="waitLine">🎲 サイコロ待ち</div></div>`;
const dice=diceObj(room.race.dice);
const cards=activeCards(clone(room));
return`<div class="centerInfo"><b>🎲 ${dice.icon} ${dice.label}</b><div class="centerList">${cards.map(c=>{const p=previewMove(c);return`<div class="moveLine">🐴${horseShort(c.horse)} ${p.from}→${p.to}${p.zero?"(+0)":""}</div>`}).join("")}</div></div>`;
}
function renderTrack(){
const lastMove=room.race.lastMove||{},placed={};
for(const hid of Object.keys(room.race.horses)){
const s=room.race.horses[hid];
if(s.status==="finished")continue;
const pos=Math.max(1,Math.min(GOAL_LINE,displayPosition(hid,s.pos)));
placed[pos]??=[];
placed[pos].push(hid);
}
const finishOrder=room.race.finishOrder.map((hid,i)=>`${i+1}着 ${horseDisplayName(hid)}`).join(" / ")||"まだゴールなし";
return`<section class="card"><div class="row between"><b>36マスコース</b><span class="small">同じマスには止まれません</span></div>${lastMove.blocked?`<div class="moveBanner">${horseDisplayName(lastMove.horse)}：${lastMove.rawTarget}が埋まっていたため${lastMove.finalTarget}へ戻りました</div>`:""}<div class="trackBoard">${renderCenter()}${trackSpaces().map(sp=>{const horses=placed[sp.no]||[],cls=`trackSpace ${sp.no===GOAL_LINE?"finish":""} ${sp.no===PACE_SPACE?"pace":""}`;return`<div class="${cls}" style="left:${sp.x}%;top:${sp.y}%"><div class="num">${sp.no}</div><div class="lab">${sp.no===GOAL_LINE?"GOAL":sp.no===PACE_SPACE?"PACE":""}</div><div class="slot">${horses.map(hid=>{const hi=horseInfo(hid),c=horseCard(hid),latest=lastMove.horse===hid;return`<span class="pony ${latest?"latest":""} ${latest&&lastMove.blocked?"blocked":""} ${animationState?.horse===hid?"anim":""} ${c?.moved?"moved":""}" style="--horse-color:${hi.color}" title="${hi.label}">🐴</span>`}).join("")}</div></div>`}).join("")}</div><div style="margin-top:8px"><b>ゴール</b> <span class="small">${finishOrder}</span></div>${renderHorseCards()}</section>`;
}
function renderHorseCards(){
const isBet=room.phase==="betting"&&currentBetPlayer(room)?.id===localId&&currentBetPlayer(room)?.type==="human";
const used=isBet?alreadyBetHorses(room,localId):new Set();
const isRace=room.phase==="racing"&&currentPlayer(room)?.id===localId&&currentPlayer(room)?.type==="human";
const activeIds=isRace&&room.race.dice?new Set(activeCards(clone(room)).map(c=>c.horse)):new Set();
return`<div class="cardStrip">${room.race.cards.map(c=>{
const h=horseInfo(c.horse);
const canBet=isBet&&!used.has(c.horse);
const canMove=isRace&&room.race.dice&&activeIds.has(c.horse);
const bets=room.race.bets.filter(b=>b.horse===c.horse);
return`<div class="horseCard ${c.moved?"moved":""} ${canBet?"clickable betCard":""} ${canMove?"clickable moveCard":""} ${used.has(c.horse)?"selected":""}" data-horse="${c.horse}">
<div class="horseHead"><b class="horseName"><span class="pony" style="--horse-color:${h.color}">🐴</span> ${c.name}</b></div>
<div class="betMini">${bets.map(b=>{const p=room.players.find(x=>x.id===b.playerId);return`<span class="pill">${escapeHtml(p?.name||"?")}</span>`}).join("")}</div>
</div>`;
}).join("")}</div>`;
}
function renderPayoutGuide(){return`<section class="card"><b>配当表</b>${payoutTable()}</section>`}
function renderActionPanel(){
if(room.phase==="racing")return renderRaceAction();
if(room.phase==="payout")return`<section class="actions"><div class="primaryActionRow"><button id="nextRace" class="good" ${!isHost()?"disabled":""}>次のレースへ</button><button id="quitToTop" class="secondary">ゲームをやめる</button></div></section>`;
if(room.phase==="gameover")return`<section class="actions"><div class="primaryActionRow"><button id="backToLobby" ${!isHost()?"disabled":""}>ロビーに戻る</button><button id="quitToTop" class="secondary">ゲームをやめる</button></div></section>`;
return"";
}
function renderRaceAction(){
const p=currentPlayer(room);
if(animationState)return"";
if(room.race.dice||room.race.diceRolling)return"";
if(p.id!==localId||p.type!=="human")return"";
return`<section class="actions"><div class="primaryActionRow"><button id="rollDice" class="good">🎲 サイコロを振る</button></div><div class="dicePanel">${renderDiceVisual(room.race.dice,room.race.diceRolling)}</div></section>`;
}
function renderPayout(){
if(!room.race?.payout)return"";
const order=room.race.finishOrder.map((hid,i)=>`${i+1}着 ${horseDisplayName(hid)}`).join(" / "),last=room.race.lastHorse?horseDisplayName(room.race.lastHorse):"-",winner=[...room.players].sort((a,b)=>b.money-a.money)[0];
return`<section class="card"><b>${room.phase==="gameover"?"最終結果":"払い戻し"}</b><div class="row" style="margin-top:8px"><span class="pill">${order}</span><span class="pill">最下位 ${last}</span><span class="pill">倍率 ${room.race.payout.multiplier}倍</span></div><div class="grid" style="margin-top:10px">${room.race.payout.playerResults.map(res=>`<div class="playerBox"><div class="row between"><b>${escapeHtml(res.name)}</b><span class="money">${res.net>=0?"+":""}${res.net} → ¥${res.after}</span></div><div class="tiny">${res.details.length?escapeHtml(res.details.join(" / ")):"的中・支払いなし"}</div></div>`).join("")}</div>${room.phase==="gameover"?`<div class="card" style="box-shadow:none;background:#fff"><span class="rank">🏆</span> 優勝：<b>${escapeHtml(winner.name)}</b> ¥${winner.money}</div>`:""}</section>`;
}
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==="suspended")audioCtx.resume()}
function playNote(freq,start,duration,type="square",gain=.05){
if(!audioCtx)return;
const osc=audioCtx.createOscillator(),g=audioCtx.createGain();
osc.type=type;osc.frequency.value=freq;
g.gain.setValueAtTime(.0001,start);
g.gain.exponentialRampToValueAtTime(gain,start+.02);
g.gain.exponentialRampToValueAtTime(.0001,start+duration);
osc.connect(g).connect(audioCtx.destination);
osc.start(start);
osc.stop(start+duration+.02);
}
function playEffect(kind){
if(!bgmOn)return;
ensureAudio();
const t=audioCtx.currentTime;
(kind==="dice"?[420,520,630,760]:[330,392,494]).forEach((f,i)=>playNote(f,t+i*.07,.06,"triangle",.035));
}
function bgmTick(){
if(!bgmOn)return;
ensureAudio();
const t=audioCtx.currentTime,mel=[523,659,784,659,698,880,784,659,523,659,784,988,880,784,659,587],bass=[196,196,220,220,196,196,247,247];
for(let i=0;i<4;i++){
playNote(mel[(bgmStep+i)%mel.length],t+i*.18,.14,"square",.025);
if(i%2===0)playNote(bass[Math.floor((bgmStep+i)/2)%bass.length],t+i*.18,.16,"triangle",.018);
}
bgmStep=(bgmStep+4)%mel.length;
}
function startBgm(){ensureAudio();bgmOn=true;bgmTick();clearInterval(bgmTimer);bgmTimer=setInterval(bgmTick,720);render()}
function stopBgm(){bgmOn=false;clearInterval(bgmTimer);render()}
function toggleBgm(){bgmOn?stopBgm():startBgm()}
function bindEvents(){
document.getElementById("createRoom")?.addEventListener("click",createRoom);
document.getElementById("joinRoom")?.addEventListener("click",joinRoom);
document.getElementById("addCpu")?.addEventListener("click",addCpu);
document.getElementById("removeCpu")?.addEventListener("click",removeCpu);
document.getElementById("cpuLevel")?.addEventListener("change",updateCpuLevel);
document.getElementById("startGame")?.addEventListener("click",startGame);
document.getElementById("rollDice")?.addEventListener("click",rollDice);
document.getElementById("nextRace")?.addEventListener("click",nextRace);
document.getElementById("backToLobby")?.addEventListener("click",backToLobby);
document.getElementById("quitToTop")?.addEventListener("click",quitToTop);
document.querySelectorAll("#toggleBgm").forEach(btn=>btn.addEventListener("click",toggleBgm));
document.querySelectorAll(".betCard").forEach(el=>el.addEventListener("click",e=>{e.stopPropagation();placeBet(el.dataset.horse)}));
document.querySelectorAll(".moveCard").forEach(el=>el.addEventListener("click",e=>{e.stopPropagation();moveHorse(el.dataset.horse)}));
}

await initFirebase().catch(err=>{console.warn("Firebase init failed",err);online=false});
if(roomCode)await openRoom(roomCode);
render();
</script>
</body>
</html>
