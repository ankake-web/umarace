<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>うまダッシュ・ターフ</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --card: #fffaf0;
      --ink: #29231b;
      --muted: #766d62;
      --line: #d9c9ac;
      --accent: #7a4b20;
      --accent2: #198754;
      --danger: #b3261e;
      --shadow: 0 10px 24px rgba(49, 34, 18, .12);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #fff8df 0, var(--bg) 44%, #eadcc8 100%);
      color: var(--ink);
    }
    button, input, select { font: inherit; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      background: var(--accent);
      color: white;
      font-weight: 750;
      box-shadow: 0 4px 10px rgba(0,0,0,.12);
    }
    button.secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    button.good { background: var(--accent2); }
    button.danger { background: var(--danger); }
    button:disabled { opacity: .45; box-shadow: none; }
    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      background: #fff;
      color: var(--ink);
    }
    .app { max-width: 980px; margin: 0 auto; padding: 12px; padding-bottom: 150px; }
    .hero {
      background: linear-gradient(135deg, #4d8a4d, #246a46);
      color: white;
      border-radius: 24px;
      padding: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }
    .hero:after { content: "🐎"; position: absolute; right: 12px; top: 0; font-size: 88px; opacity: .22; transform: rotate(-8deg); }
    h1 { margin: 0; font-size: 28px; letter-spacing: .03em; }
    .subtitle { margin-top: 6px; opacity: .9; font-size: 13px; }
    .grid { display: grid; gap: 10px; }
    .two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .card {
      background: rgba(255, 250, 240, .92);
      border: 1px solid rgba(217, 201, 172, .85);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow);
      margin-top: 12px;
    }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .between { justify-content: space-between; }
    .small { font-size: 12px; color: var(--muted); }
    .tiny { font-size: 11px; color: var(--muted); }
    .pill { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 9px; font-size: 12px; font-weight: 700; }
    .money { font-variant-numeric: tabular-nums; font-weight: 850; }
    .current { outline: 3px solid rgba(25, 135, 84, .25); }
    .playerBox { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
    .track { display: grid; gap: 7px; }
    .lane { display: grid; grid-template-columns: 90px 1fr 42px; gap: 7px; align-items: center; }
    .laneName { font-size: 12px; font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar { position: relative; height: 30px; border-radius: 999px; background: linear-gradient(90deg, #d8b37c, #f5e0b5 16%, #d2e7bd 17%, #d2e7bd 100%); border: 1px solid #c4a980; overflow: hidden; }
    .bar:before { content: "P"; position: absolute; left: calc((24 / 36) * 100%); top: 0; bottom: 0; width: 2px; background: rgba(30,90,20,.4); font-size: 10px; color: #1d5e2f; }
    .bar:after { content: "G"; position: absolute; right: 4px; top: 6px; font-size: 10px; color: #7b1d1d; font-weight: 900; }
    .horseDot { position: absolute; top: 2px; transform: translateX(-50%); width: 26px; height: 26px; display: grid; place-items: center; border-radius: 999px; background: #fff; border: 2px solid #333; box-shadow: 0 2px 5px rgba(0,0,0,.22); font-size: 16px; }
    .horseDot.done { filter: grayscale(.2); background: #ffe6b3; }
    .horseDot.moved { opacity: .48; }
    .horseDot.pace { outline: 3px solid #ffd54a; }
    .betArea { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .horseBet { border: 1px solid var(--line); border-radius: 14px; padding: 9px; background: #fff; min-height: 74px; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .chip { min-width: 26px; height: 26px; border-radius: 999px; border: 2px solid #444; display: inline-grid; place-items: center; font-size: 12px; font-weight: 900; background: #fff; color: #222; }
    .chip.hidden { background: #333; color: #333; }
    .chip.zero { border-style: dashed; color: #777; }
    .actions {
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: calc(8px + env(safe-area-inset-bottom));
      max-width: 980px;
      margin: 0 auto;
      z-index: 20;
      background: rgba(255,250,240,.96);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 10px;
      box-shadow: 0 14px 32px rgba(0,0,0,.22);
      backdrop-filter: blur(10px);
    }
    .actions .primaryActionRow { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .actions .primaryActionRow button { flex: 1 1 auto; }
    .actions.compactAction { padding: 9px; }
    .stickyDiceMini {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 9px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 900;
    }
    .stickyDiceIcon { font-size: 20px; }
    .log { max-height: 160px; overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
    .log div { padding: 4px 0; border-bottom: 1px dashed #eee; font-size: 12px; }
    .rank { font-size: 24px; font-weight: 900; }
    .selected { outline: 3px solid rgba(25, 135, 84, .35); }

    /* ===== トップページ強化 ===== */
    .homeHeroCard {
      margin-top: 12px;
      padding: 18px;
      border-radius: 26px;
      background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,.9), transparent 34%),
        linear-gradient(135deg, #215f3b, #3b8f52 58%, #d7a447);
      color: white;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      min-height: 230px;
    }
    .homeHeroCard:after {
      content: "🐎";
      position: absolute;
      right: -8px;
      bottom: -20px;
      font-size: 132px;
      opacity: .24;
      transform: rotate(-10deg);
    }
    .homeTitle {
      font-size: clamp(30px, 8vw, 54px);
      font-weight: 950;
      letter-spacing: .04em;
      line-height: 1.05;
      margin: 0;
      text-shadow: 0 3px 12px rgba(0,0,0,.22);
    }
    .homeLead { max-width: 520px; margin-top: 10px; font-weight: 750; opacity: .96; }
    .homeBadges { display:flex; gap:7px; flex-wrap:wrap; margin-top:14px; }
    .homeBadge { background: rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.34); border-radius:999px; padding:7px 10px; font-size:12px; font-weight:850; backdrop-filter: blur(6px); }
    .homePanel { margin-top: 12px; display:grid; grid-template-columns: 1.2fr .8fr; gap: 12px; }
    .homeForm, .homeHowTo {
      background: rgba(255,250,240,.94);
      border: 1px solid rgba(217,201,172,.9);
      border-radius: 22px;
      padding: 14px;
      box-shadow: var(--shadow);
    }
    .homeHowTo ol { margin: 8px 0 0; padding-left: 20px; }
    .homeHowTo li { margin: 6px 0; }

    /* ===== 双六風ボード ===== */
    .sugorokuBoardWrap { margin-top: 10px; }
    .sugorokuBoard {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 4px;
      padding: 8px;
      border-radius: 22px;
      background: linear-gradient(180deg, #347f43, #236839);
      border: 6px solid #6c4a25;
      box-shadow: inset 0 0 0 4px rgba(255,255,255,.17), var(--shadow);
    }
    .space {
      min-height: 44px;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      background: transparent;
    }
    .space.path {
      background: linear-gradient(180deg, #f4d29b, #c9924e);
      border: 2px solid rgba(77,45,18,.42);
      box-shadow: inset 0 2px 0 rgba(255,255,255,.32);
    }
    .space.empty { visibility: hidden; }
    .space.start { background: repeating-linear-gradient(45deg, #fff 0 8px, #222 8px 16px); color: #222; }
    .space.finish { background: linear-gradient(180deg, #ffe26a, #d79a1c); }
    .space.pace { outline: 3px solid #fff178; }
    .spaceNum {
      position: absolute;
      left: 4px;
      top: 3px;
      font-size: 10px;
      font-weight: 950;
      color: rgba(49,35,20,.72);
      z-index: 2;
    }
    .spaceLabel {
      position: absolute;
      right: 4px;
      bottom: 3px;
      font-size: 9px;
      font-weight: 950;
      color: rgba(49,35,20,.72);
      z-index: 2;
    }
    .spaceHorses {
      position: absolute;
      inset: 15px 3px 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1px;
      z-index: 4;
    }
    .miniHorse {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: #fff;
      border: 3px solid var(--horse-color);
      box-shadow: 0 3px 8px rgba(0,0,0,.2);
      font-size: 13px;
      transition: transform .18s ease;
    }
    .miniHorse.animating { transform: scale(1.18); box-shadow: 0 0 0 4px rgba(255,235,59,.7), 0 6px 12px rgba(0,0,0,.24); }
    .miniHorse.latest { animation: horseHop .8s ease both; }
    .miniHorse.blocked { animation: blockedBounce .95s ease both; }
    .paddock {
      margin-top: 8px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 8px;
    }
    .moveBanner {
      margin-top: 8px;
      padding: 8px 10px;
      border-radius: 14px;
      background: #fff7d6;
      border: 1px solid #e3c765;
      font-size: 12px;
      font-weight: 850;
    }
    .remainTag { font-size: 11px; color: var(--muted); font-weight: 850; }
    @keyframes horseHop {
      0% { transform: translateY(0) scale(1); }
      35% { transform: translateY(-10px) scale(1.15); }
      70% { transform: translateY(1px) scale(.98); }
      100% { transform: translateY(0) scale(1); }
    }
    @keyframes blockedBounce {
      0% { transform: translateX(0) scale(1); }
      25% { transform: translateX(12px) translateY(-5px) scale(1.12); }
      55% { transform: translateX(-8px) scale(.98); }
      80% { transform: translateX(3px); }
      100% { transform: translateX(0) scale(1); }
    }

    /* ===== 見た目強化：1周コース + サイコロ演出 ===== */
    .raceVisual {
      position: relative;
      height: min(68vw, 520px);
      min-height: 340px;
      border-radius: 28px;
      background: linear-gradient(180deg, #64b96c, #2f8f4a);
      border: 10px solid #6c4a25;
      overflow: hidden;
      box-shadow: inset 0 0 0 6px rgba(255,255,255,.25), var(--shadow);
    }
    .raceVisual:before {
      content: "";
      position: absolute;
      inset: 8%;
      border-radius: 50%;
      border: 38px solid #c99658;
      box-shadow: inset 0 0 0 4px rgba(255,255,255,.25), 0 0 0 3px rgba(74,42,15,.35);
    }
    .raceVisual:after {
      content: "";
      position: absolute;
      inset: 27% 24%;
      border-radius: 50%;
      background: linear-gradient(180deg, #5cb85c, #318f4a);
      border: 3px dashed rgba(255,255,255,.45);
    }
    .startLine {
      position: absolute;
      top: 8%;
      left: 50%;
      width: 6px;
      height: 80px;
      transform: translateX(-50%);
      background: repeating-linear-gradient(180deg, #fff 0 8px, #111 8px 16px);
      border-radius: 8px;
      z-index: 2;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .startLabel, .paceLabel {
      position: absolute;
      z-index: 3;
      padding: 5px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(0,0,0,.1);
      font-size: 11px;
      font-weight: 900;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
    }
    .startLabel { top: 5%; left: 50%; transform: translateX(-50%); }
    .paceLabel { right: 11%; bottom: 27%; color: #0f6c36; }
    .horseSprite {
      position: absolute;
      z-index: 5;
      left: var(--x);
      top: var(--y);
      transform: translate(-50%, -50%) rotate(var(--rot));
      transition: left .75s cubic-bezier(.2,.85,.2,1), top .75s cubic-bezier(.2,.85,.2,1), transform .75s cubic-bezier(.2,.85,.2,1), filter .2s;
    }
    .horseSprite.moved { filter: grayscale(.75) opacity(.65); }
    .horseSprite.done { filter: drop-shadow(0 0 8px #ffd54a); }
    .horseToken {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff;
      border: 4px solid var(--horse-color);
      box-shadow: 0 5px 12px rgba(0,0,0,.28);
      font-size: 24px;
      position: relative;
    }
    .horseToken:after {
      content: attr(data-rank);
      position: absolute;
      right: -7px;
      top: -8px;
      min-width: 20px;
      height: 20px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: #fff3bf;
      color: #6b4500;
      font-size: 10px;
      font-weight: 950;
      border: 1px solid #d7aa26;
    }
    .horseNameTag {
      position: absolute;
      left: 50%;
      top: 42px;
      transform: translateX(-50%) rotate(calc(-1 * var(--rot)));
      white-space: nowrap;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 999px;
      padding: 3px 7px;
      font-size: 10px;
      font-weight: 850;
      box-shadow: 0 2px 6px rgba(0,0,0,.14);
    }
    .cardStrip {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .raceCardMini {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 8px;
      font-size: 12px;
    }
    .raceCardMini.moved { opacity: .48; }
    .moveNums { display:flex; gap:4px; flex-wrap:wrap; margin-top:5px; }
    .moveNums span { background:#f6efe2; border-radius:999px; padding:3px 6px; font-size:11px; font-weight:800; }
    .dicePanel { margin-top: 10px; display:flex; justify-content:center; }
    .diceStage {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 10px 14px;
      box-shadow: 0 6px 16px rgba(0,0,0,.12);
    }
    .diceCube {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 30% 25%, #fff, #f5f5f5 45%, #d9d9d9);
      border: 3px solid #222;
      font-size: 30px;
      box-shadow: 0 8px 0 #b8b8b8, 0 12px 16px rgba(0,0,0,.22);
      transform: rotate(-5deg);
    }
    .diceCube.rolling {
      animation: diceShake .12s infinite alternate, diceSpin .6s infinite linear;
    }
    .diceText { font-size: 13px; font-weight: 900; }
    .diceFaces { letter-spacing: .18em; color: var(--muted); font-size: 12px; }
    @keyframes diceShake {
      from { translate: -3px -2px; }
      to { translate: 3px 2px; }
    }
    @keyframes diceSpin {
      from { rotate: 0deg; }
      to { rotate: 360deg; }
    }

    @media (max-width: 560px) {
      .homePanel { grid-template-columns: 1fr; }
      .homeHeroCard { min-height: 210px; }
      .sugorokuBoard { gap: 3px; padding: 5px; border-width: 4px; }
      .space { min-height: 34px; border-radius: 8px; }
      .space.path { border-width: 1px; }
      .spaceNum { font-size: 8px; left: 3px; top: 2px; }
      .spaceLabel { font-size: 7px; right: 3px; bottom: 2px; }
      .miniHorse { width: 18px; height: 18px; font-size: 11px; border-width: 2px; }
      .spaceHorses { inset: 12px 2px 2px; }
      .two, .three { grid-template-columns: 1fr; }
      .lane { grid-template-columns: 72px 1fr 34px; }
      .betArea { grid-template-columns: 1fr; }
      h1 { font-size: 24px; }
      .app { padding: 8px; }
    }
  </style>
</head>
<body>
  <div id="app" class="app"></div>

<script type="module">
  // ============================================================
  // うまダッシュ・ターフ
  // 1ファイルHTML版。スマホ2台同期は Firebase の設定が必要です。
  //
  // 1) Firebase ConsoleでWebアプリを作る
  // 2) Authentication > 匿名ログインを有効化
  // 3) Firestore Databaseを作成
  // 4) 下の firebaseConfig を自分の値に置き換える
  // ============================================================

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCxHux7rE19LCvV-2sNwhEMtGABf3tZgDs",
    authDomain: "umauma-737d6.firebaseapp.com",
    projectId: "umauma-737d6",
    storageBucket: "umauma-737d6.firebasestorage.app",
    messagingSenderId: "704545420057",
    appId: "1:704545420057:web:9fa4081aa62dc5900d4b88",
    measurementId: "G-0E7DM5B4VB"
  };

  const GAME_TITLE = "うまダッシュ・ターフ";
  const MAX_PLAYERS = 6;
  const PACE_SPACE = 18;
  const GOAL_LINE = 36;
  const MIN_POS = 1;

  const DICE = [
    { key: "head", label: "馬首", icon: "🐴" },
    { key: "head", label: "馬首", icon: "🐴" },
    { key: "head", label: "馬首", icon: "🐴" },
    { key: "hat", label: "帽子", icon: "🎩" },
    { key: "carrot", label: "ニンジン", icon: "🥕" },
    { key: "shoe", label: "蹄鉄", icon: "🧲" }
  ];

  const HORSES = [
    { id: "white",  label: "ホワイト", icon: "⚪", color: "#f8f8f8" },
    { id: "black",  label: "ブラック", icon: "⚫", color: "#333333" },
    { id: "pink",   label: "ピンク",   icon: "🌸", color: "#f78ac3" },
    { id: "blue",   label: "ブルー",   icon: "🔵", color: "#2f80ed" },
    { id: "yellow", label: "イエロー", icon: "🟡", color: "#f2c94c" },
    { id: "green",  label: "グリーン", icon: "🟢", color: "#27ae60" },
    { id: "orange", label: "オレンジ", icon: "🟠", color: "#f2994a" }
  ];

  // 旧固定カードは残さず、各レースごとに下の NAME_BANK / ARCHETYPE_TEMPLATES から自動生成します。
  const CARD_DECK = [];

  // 配当表：列はその馬への総ベット数。5以上は5列目を使用。
  const PAYOUT_TABLE = {
    1: [500, 350, 250, 200, 150],
    2: [350, 250, 200, 150, 100],
    3: [250, 200, 150, 100, 100]
  };

  const PLAYER_COLORS = ["#e53935", "#1e88e5", "#43a047", "#8e24aa", "#fb8c00", "#546e7a"];
  const CPU_NAMES = ["CPUミドリ", "CPUアオ", "CPUモモ", "CPUクロ", "CPUキイロ"];

  let appEl = document.getElementById("app");
  let localId = localStorage.getItem("umaDashPlayerId") || crypto.randomUUID();
  localStorage.setItem("umaDashPlayerId", localId);
  let localName = localStorage.getItem("umaDashPlayerName") || "井上";
  let roomCode = new URL(location.href).hash.replace("#", "").trim().toUpperCase();
  let room = null;
  let db = null;
  let online = false;
  let roomRef = null;
  let unsubscribe = null;
  let selectedChip = null;
  let cpuTimer = null;
  let lastAnimatedMoveTs = null;
  let animationState = null;
  let animationTimer = null;

  function hasFirebaseConfig() {
    return Boolean(firebaseConfig.apiKey && firebaseConfig.projectId);
  }

  async function initFirebase() {
    if (!hasFirebaseConfig()) return;
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    await signInAnonymously(auth);
    db = getFirestore(app);
    online = true;
  }

  function clone(x) { return JSON.parse(JSON.stringify(x)); }
  function horseInfo(id) { return HORSES.find(h => h.id === id); }
  function playerName(id, r = room) { return r.players.find(p => p.id === id)?.name || "?"; }
  function currentPlayer(r = room) { return r.players[r.turnIndex % r.players.length]; }
  function chipsForRule(r = room) { return [1, 1, 2]; }
  function chipLabel(v) { return v === 0 ? "0" : String(v); }
  function diceObj(key) { return DICE.find(d => d.key === key); }
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function randomCode() {
    return Math.random().toString(36).slice(2, 6).toUpperCase();
  }

  async function saveRoom(next) {
    room = next;
    if (online && roomCode) {
      await setDoc(roomRef, next);
    } else {
      localStorage.setItem("umaDashLocalRoom", JSON.stringify(next));
      render();
    }
  }

  async function createRoom() {
    const nameInput = document.getElementById("playerName");
    localName = (nameInput?.value || localName || "プレイヤー").trim();
    localStorage.setItem("umaDashPlayerName", localName);
    roomCode = (document.getElementById("roomCode")?.value || randomCode()).trim().toUpperCase();
    history.replaceState(null, "", "#" + roomCode);
    const base = {
      version: 1,
      title: GAME_TITLE,
      code: roomCode,
      hostId: localId,
      phase: "lobby",
      secretBet: false,
      raceNo: 0,
      turnIndex: 0,
      starterIndex: 0,
      players: [{ id: localId, name: localName, type: "human", color: PLAYER_COLORS[0], money: 0, seat: 0 }],
      race: null,
      createdAt: Date.now(),
      updatedAt: Date.now()
    };
    await openRoom(roomCode);
    await saveRoom(base);
  }

  async function joinRoom() {
    const nameInput = document.getElementById("playerName");
    localName = (nameInput?.value || localName || "プレイヤー").trim();
    localStorage.setItem("umaDashPlayerName", localName);
    roomCode = (document.getElementById("roomCode")?.value || roomCode || "").trim().toUpperCase();
    if (!roomCode) return alert("部屋番号を入れてください");
    history.replaceState(null, "", "#" + roomCode);
    await openRoom(roomCode);
  }

  async function openRoom(code) {
    roomCode = code;
    if (unsubscribe) unsubscribe();
    if (online) {
      roomRef = doc(db, "rooms", roomCode);
      unsubscribe = onSnapshot(roomRef, async snap => {
        if (!snap.exists()) {
          room = null;
          render();
          return;
        }
        room = snap.data();
        await maybeJoinAsHuman();
        maybeStartMoveAnimation();
        render();
        maybeRunCpu();
      });
    } else {
      const saved = localStorage.getItem("umaDashLocalRoom");
      room = saved ? JSON.parse(saved) : null;
      render();
    }
  }

  async function maybeJoinAsHuman() {
    if (!room || room.phase !== "lobby") return;
    if (room.players.some(p => p.id === localId)) return;
    if (room.players.length >= MAX_PLAYERS) return;
    const next = clone(room);
    next.players.push({
      id: localId,
      name: localName || "プレイヤー",
      type: "human",
      color: PLAYER_COLORS[next.players.length],
      money: 0,
      seat: next.players.length
    });
    next.updatedAt = Date.now();
    await saveRoom(next);
  }

  async function quitToTop() {
    if (!room) return;
    const oldId = localId;
    const next = clone(room);
    const me = next.players.find(p => p.id === oldId);
    if (me) {
      me.type = "cpu";
      me.name = `CPU代理-${me.name.replace(/^CPU代理-/, "")}`;
    }
    const otherHuman = next.players.find(p => p.type === "human" && p.id !== oldId);
    if (next.hostId === oldId && otherHuman) next.hostId = otherHuman.id;
    next.race?.log?.unshift(`${me?.name || "退出者"} が操作をCPUに引き継ぎました。`);
    next.updatedAt = Date.now();
    await saveRoom(next);
    if (unsubscribe) unsubscribe();
    localId = crypto.randomUUID();
    localStorage.setItem("umaDashPlayerId", localId);
    room = null;
    roomCode = "";
    history.replaceState(null, "", location.pathname);
    render();
  }

  async function addCpu() {
    if (!isHost() || !room || room.players.length >= MAX_PLAYERS) return;
    const next = clone(room);
    const cpuCount = next.players.filter(p => p.type === "cpu").length;
    if (cpuCount >= 5) return;
    const id = "cpu-" + crypto.randomUUID();
    next.players.push({
      id,
      name: CPU_NAMES[cpuCount] || `CPU${cpuCount + 1}`,
      type: "cpu",
      color: PLAYER_COLORS[next.players.length],
      money: 0,
      seat: next.players.length
    });
    await saveRoom(next);
  }

  function isHost() { return room?.hostId === localId; }
  function isLocalTurn() { return currentPlayer()?.id === localId; }

  async function startGame() {
    if (!isHost()) return;
    if (room.players.length < 1) return alert("プレイヤーを1人以上にしてください");
    const next = clone(room);
    next.players.forEach(p => p.money = 0);
    next.raceNo = 1;
    next.starterIndex = Math.floor(Math.random() * next.players.length);
    setupRace(next);
    await saveRoom(next);
  }

  function chooseStarterIndex(r) {
    if (r.raceNo === 1) return Math.floor(Math.random() * r.players.length);
    const maxMoney = Math.max(...r.players.map(p => p.money));
    const rich = r.players.map((p, i) => ({ p, i })).filter(x => x.p.money === maxMoney);
    return rich[Math.floor(Math.random() * rich.length)].i;
  }

  const NAME_BANK = {
    white:  ["シロインパクト", "ホワイトキャップ", "シロカイテイオー", "オグリホワイト"],
    black:  ["クロフネール", "ブラックルドルフ", "クロノブライアン", "キタサンブラックロ"],
    pink:   ["サクラピンクオー", "ピンクリキャップ", "ロゼアマゾン", "ハルウララピンク"],
    blue:   ["ブルーインパクト", "アオゾラシップ", "ブルカイテイオー", "アクアキャップ"],
    yellow: ["キイロールドシップ", "イエローモンドアイ", "ゴルドンブラック", "ナリタキイロード"],
    green:  ["グリーンルドルフ", "ミドリバクシンオー", "グラスグリーン", "エルコングリーン"],
    orange: ["オレンジブライアン", "ダイワオレンジ", "サンセットシップ", "オレンジアマゾン"]
  };

  // weighted = head*3 + hat + carrot + shoe がだいたい30になるように調整。
  // 馬首はサイコロ3面なので、馬首が高い型は他を低めにして総合力を揃える。
  const ARCHETYPE_TEMPLATES = [
    { type: "バランス型", moves: { head: 5, hat: 5, carrot: 5, shoe: 5 } },
    { type: "人参巧者", moves: { head: 4, hat: 4, carrot: 8, shoe: 6 } },
    { type: "帽子巧者", moves: { head: 4, hat: 8, carrot: 4, shoe: 6 } },
    { type: "蹄鉄巧者", moves: { head: 4, hat: 6, carrot: 4, shoe: 8 } },
    { type: "馬首巧者", moves: { head: 6, hat: 4, carrot: 4, shoe: 4 } },
    { type: "差し脚型", moves: { head: 3, hat: 7, carrot: 5, shoe: 9 } },
    { type: "先行粘り型", moves: { head: 6, hat: 5, carrot: 3, shoe: 4 } },
    { type: "ムラ駆け型", moves: { head: 3, hat: 9, carrot: 7, shoe: 5 } },
    { type: "安定型", moves: { head: 5, hat: 4, carrot: 6, shoe: 5 } },
    { type: "人参全振り型", moves: { head: 3, hat: 4, carrot: 10, shoe: 7 } }
  ];

  function jitterMoves(base) {
    const moves = clone(base);
    const keys = ["hat", "carrot", "shoe"];
    // 非・馬首の中で1だけ移す。サイコロ期待値を大きく崩さず、毎レース少し個性を変える。
    if (Math.random() < 0.75) {
      const plus = keys[Math.floor(Math.random() * keys.length)];
      const minusCandidates = keys.filter(k => k !== plus && moves[k] > 2);
      const minus = minusCandidates[Math.floor(Math.random() * minusCandidates.length)];
      if (minus && moves[plus] < 10) {
        moves[plus] += 1;
        moves[minus] -= 1;
      }
    }
    return moves;
  }

  function expectedMove(moves) {
    return ((moves.head * 3) + moves.hat + moves.carrot + moves.shoe) / 6;
  }

  function horseCard(hid, r = room) {
    return r?.race?.cards?.find(c => c.horse === hid);
  }

  function horseDisplayName(hid, r = room) {
    const h = horseInfo(hid);
    const c = horseCard(hid, r);
    return `${h?.icon || ""}${c?.name || h?.label || hid}`;
  }

  function horseOddsRate(r, hid) {
    return 1;
  }

  function oddsText(r, hid) {
    return "総票数で配当決定";
  }

  function generateRaceCards() {
    const archetypes = shuffle(ARCHETYPE_TEMPLATES);
    const namePickCount = {};
    return shuffle(HORSES).map((horse, idx) => {
      const arch = archetypes[idx % archetypes.length];
      const moves = jitterMoves(arch.moves);
      const names = NAME_BANK[horse.id] || [horse.label + "スター"];
      const used = namePickCount[horse.id] || 0;
      namePickCount[horse.id] = used + 1;
      const name = names[used % names.length];
      return {
        horse: horse.id,
        name,
        archetype: arch.type,
        moves,
        expected: expectedMove(moves),
        id: crypto.randomUUID(),
        moved: false
      };
    });
  }

  function setupRace(r) {
    r.phase = "betting";
    r.starterIndex = chooseStarterIndex(r);
    r.turnIndex = r.starterIndex;
    selectedChip = null;
    const picked = generateRaceCards();
    const startPositions = shuffle([1, 2, 3, 4, 5, 6, 7]);
    const horses = {};
    picked.forEach((card, idx) => {
      horses[card.horse] = { pos: startPositions[idx], startPos: startPositions[idx], status: "running", rank: null };
    });
    r.race = {
      no: r.raceNo,
      cards: picked,
      horses,
      bets: [],
      dice: null,
      diceRolling: false,
      finishOrder: [],
      paceHorse: null,
      lastHorse: null,
      payout: null,
      lastMove: null,
      log: [`第${r.raceNo}レース開始。馬は1〜7マスにランダム配置。${r.players[r.starterIndex].name}から賭けます。`]
    };
  }

  function remainingChips(r, playerId) {
    const chips = chipsForRule(r);
    for (const bet of r.race.bets.filter(b => b.playerId === playerId)) {
      const idx = chips.indexOf(bet.chip);
      if (idx >= 0) chips.splice(idx, 1);
    }
    return chips;
  }

  function alreadyBetHorses(r, playerId) {
    return new Set(r.race.bets.filter(b => b.playerId === playerId).map(b => b.horse));
  }

  function currentBetPlayer(r = room) {
    const made = r.race.bets.length;
    return r.players[(r.starterIndex + made) % r.players.length];
  }

  async function placeBet(horseId) {
    if (!room || room.phase !== "betting") return;
    const p = currentBetPlayer(room);
    if (p.id !== localId || p.type !== "human") return;
    if (selectedChip === null) return alert("先にチップを選んでください");
    const remaining = remainingChips(room, p.id);
    if (!remaining.includes(selectedChip)) return;
    if (alreadyBetHorses(room, p.id).has(horseId)) return alert("同じ馬には2枚以上置けません");
    const next = clone(room);
    next.race.bets.push({ id: crypto.randomUUID(), playerId: p.id, horse: horseId, chip: selectedChip });
    next.race.log.unshift(`${p.name} が ${horseInfo(horseId).label} にチップを置きました。`);
    selectedChip = null;
    afterBet(next);
    await saveRoom(next);
  }

  function afterBet(r) {
    const totalNeeded = r.players.length * chipsForRule(r).length;
    if (r.race.bets.length >= totalNeeded) {
      r.phase = "racing";
      r.turnIndex = r.starterIndex;
      r.race.dice = null;
    r.race.diceRolling = false;
      r.race.log.unshift("賭け終了。レース開始！");
    } else {
      const p = currentBetPlayer(r);
      r.race.log.unshift(`次は ${p.name} の賭けです。`);
    }
  }

  async function rollDice() {
    if (!room || room.phase !== "racing" || !isLocalTurn() || currentPlayer(room)?.type !== "human" || room.race.dice || room.race.diceRolling) return;
    const next = clone(room);
    next.race.dice = null;
    next.race.diceRolling = true;
    next.race.log.unshift(`${currentPlayer(next).name} がサイコロを振っています…`);
    await saveRoom(next);

    setTimeout(async () => {
      if (!room || room.phase !== "racing" || currentPlayer(room)?.id !== localId || !room.race.diceRolling) return;
      const latest = clone(room);
      const d = DICE[Math.floor(Math.random() * DICE.length)];
      latest.race.dice = d.key;
      latest.race.diceRolling = false;
      latest.race.log.unshift(`${currentPlayer(latest).name} の出目：${d.icon} ${d.label}`);
      await saveRoom(latest);
    }, 850);
  }

  function activeCards(r) {
    let cards = r.race.cards.filter(c => r.race.horses[c.horse]?.status === "running" && !c.moved);
    if (cards.length === 0) {
      r.race.cards.forEach(c => { if (r.race.horses[c.horse]?.status === "running") c.moved = false; });
      cards = r.race.cards.filter(c => r.race.horses[c.horse]?.status === "running");
      r.race.log.unshift("全頭が一度動いたので、カードを表に戻しました。");
    }
    return cards;
  }

  async function moveHorse(horseId) {
    if (!room || room.phase !== "racing" || !isLocalTurn() || !room.race.dice) return;
    const next = clone(room);
    doMoveHorse(next, horseId);
    await saveRoom(next);
  }

  function doMoveHorse(r, horseId) {
    const p = currentPlayer(r);
    const diceKey = r.race.dice;
    const card = r.race.cards.find(c => c.horse === horseId);
    if (!card || card.moved || r.race.horses[horseId].status !== "running") return;
    const move = Number(card.moves[diceKey] || 0);
    const h = r.race.horses[horseId];
    const before = h.pos;
    const rawTarget = h.pos + move;
    const animPath = [];
    for (let step = before + 1; step <= Math.min(rawTarget, GOAL_LINE); step++) animPath.push(step);

    if (!r.race.paceHorse && rawTarget >= PACE_SPACE) {
      r.race.paceHorse = horseId;
      r.race.log.unshift(`${horseInfo(horseId).label} がペースホース！`);
    }

    if (rawTarget > GOAL_LINE) {
      h.status = "finished";
      h.rank = r.race.finishOrder.length + 1;
      h.pos = GOAL_LINE + h.rank;
      r.race.finishOrder.push(horseId);
      card.moved = true;
      r.race.lastMove = { horse: horseId, from: before, rawTarget, finalTarget: h.pos, blocked: false, path: animPath, ts: Date.now() };
      r.race.log.unshift(`${p.name} が ${horseDisplayName(horseId, r)} を ${move}進め、${h.rank}着でゴール！`);
    } else {
      const occupied = new Set(Object.entries(r.race.horses)
        .filter(([hid, state]) => hid !== horseId && state.status === "running")
        .map(([_, state]) => state.pos));
      let target = rawTarget;
      while (target > before && occupied.has(target)) target--;
      h.pos = target;
      card.moved = true;
      const blocked = target < rawTarget;
      if (blocked) {
        for (let step = Math.min(rawTarget, GOAL_LINE) - 1; step >= target; step--) animPath.push(step);
      }
      r.race.lastMove = { horse: horseId, from: before, rawTarget, finalTarget: target, blocked, path: animPath, ts: Date.now() };
      if (blocked) {
        r.race.log.unshift(`${p.name} が ${horseDisplayName(horseId, r)} を ${rawTarget}まで進めようとしましたが、マスが埋まっていたため ${target} まで戻りました。`);
      } else {
        r.race.log.unshift(`${p.name} が ${horseDisplayName(horseId, r)} を ${before} → ${target} に進めました。`);
      }
    }

    if (r.race.finishOrder.length >= 3) {
      finishRace(r);
      return;
    }

    activeCards(r);
    r.turnIndex = (r.turnIndex + 1) % r.players.length;
    r.race.dice = null;
  }

  function finishRace(r) {
    const running = Object.entries(r.race.horses).filter(([_, s]) => s.status === "running");
    running.sort((a, b) => a[1].pos - b[1].pos);
    const lastHorse = running[0]?.[0] || null;
    r.race.lastHorse = lastHorse;
    if (lastHorse) r.race.horses[lastHorse].rank = 7;
    r.race.payout = calculatePayout(r);
    r.phase = r.raceNo >= 3 ? "gameover" : "payout";
    r.race.log.unshift(`第${r.raceNo}レース終了。払い戻しを計算しました。`);
  }

  function calculatePayout(r) {
    const multiplier = r.raceNo === 3 ? 2 : 1;
    const horseTotals = {};
    for (const h of HORSES) horseTotals[h.id] = 0;
    for (const bet of r.race.bets) if (bet.chip > 0) horseTotals[bet.horse] += bet.chip;

    const playerResults = r.players.map(p => ({
      playerId: p.id,
      name: p.name,
      before: p.money,
      gain: 0,
      loss: 0,
      details: []
    }));

    function resultOf(pid) { return playerResults.find(x => x.playerId === pid); }

    for (const bet of r.race.bets) {
      if (bet.chip <= 0) continue;
      const res = resultOf(bet.playerId);
      const rankIndex = r.race.finishOrder.indexOf(bet.horse);
      if (rankIndex >= 0 && rankIndex < 3) {
        const rank = rankIndex + 1;
        const total = Math.max(1, horseTotals[bet.horse]);
        const col = Math.min(total, 5) - 1;
        let amount = PAYOUT_TABLE[rank][col] * bet.chip;
        if (r.race.paceHorse === bet.horse) amount += 100 * bet.chip;
        amount *= multiplier;
        res.gain += amount;
        res.details.push(`${horseDisplayName(bet.horse, r)}${rank}着 +${amount}`);
      }
      if (r.race.lastHorse === bet.horse) {
        const amount = 100 * bet.chip * multiplier;
        res.loss += amount;
        res.details.push(`${horseDisplayName(bet.horse, r)}最下位 -${amount}`);
      }
    }

    for (const res of playerResults) {
      const player = r.players.find(p => p.id === res.playerId);
      player.money += res.gain;
      const payable = Math.min(player.money, res.loss);
      player.money -= payable;
      res.loss = payable;
      res.after = player.money;
      res.net = res.after - res.before;
    }

    return { multiplier, horseTotals, playerResults };
  }

  async function nextRace() {
    if (!isHost() || !room || room.phase !== "payout") return;
    const next = clone(room);
    next.raceNo += 1;
    setupRace(next);
    await saveRoom(next);
  }

  async function backToLobby() {
    if (!isHost() || !room) return;
    const next = clone(room);
    next.phase = "lobby";
    next.raceNo = 0;
    next.race = null;
    next.players.forEach(p => p.money = 0);
    await saveRoom(next);
  }

  function cpuChooseBet(r, cpu) {
    const remaining = remainingChips(r, cpu.id);
    const used = alreadyBetHorses(r, cpu.id);
    let chip = [...remaining].sort((a, b) => b - a)[0];
    if (r.secretBet && remaining.includes(0) && Math.random() < 0.32) chip = 0;
    const options = r.race.cards
      .filter(c => !used.has(c.horse))
      .map(c => {
        const avg = (c.moves.head * 3 + c.moves.hat + c.moves.carrot + c.moves.shoe) / 6;
        const pos = r.race.horses[c.horse].pos;
        const popularity = r.race.bets.filter(b => b.horse === c.horse).reduce((s, b) => s + Math.max(0, b.chip), 0);
        return { horse: c.horse, score: avg * 2 + pos * .6 - popularity * 1.1 + Math.random() * 3 };
      })
      .sort((a, b) => b.score - a.score);
    return { chip, horse: options[0].horse };
  }

  function cpuChooseMove(r, cpu) {
    if (!r.race.dice) return null;
    const cards = activeCards(r);
    const own = Object.fromEntries(r.race.bets.filter(b => b.playerId === cpu.id).map(b => [b.horse, b.chip]));
    const options = cards.map(c => {
      const move = Number(c.moves[r.race.dice] || 0);
      const pos = r.race.horses[c.horse].pos;
      const ownChip = own[c.horse] || 0;
      const others = r.race.bets.filter(b => b.horse === c.horse && b.playerId !== cpu.id).reduce((s, b) => s + Math.max(0, b.chip), 0);
      let score = move * 4 + ownChip * 35 - others * 8 + Math.random() * 8;
      if (ownChip && pos + move >= PACE_SPACE && !r.race.paceHorse) score += 25;
      if (ownChip && pos + move > GOAL_LINE) score += 90;
      if (!ownChip && pos + move > GOAL_LINE) score -= 35;
      return { horse: c.horse, score };
    }).sort((a, b) => b.score - a.score);
    return options[0]?.horse;
  }

  function maybeRunCpu() {
    clearTimeout(cpuTimer);
    if (!room || !isHost()) return;
    const cpuAction = async () => {
      if (!room || !isHost()) return;
      const next = clone(room);
      if (next.phase === "betting") {
        const p = currentBetPlayer(next);
        if (p?.type !== "cpu") return;
        const choice = cpuChooseBet(next, p);
        next.race.bets.push({ id: crypto.randomUUID(), playerId: p.id, horse: choice.horse, chip: choice.chip });
        next.race.log.unshift(`${p.name} がチップを置きました。`);
        afterBet(next);
        await saveRoom(next);
      } else if (next.phase === "racing") {
        const p = currentPlayer(next);
        if (p?.type !== "cpu") return;
        if (!next.race.dice && !next.race.diceRolling) {
          next.race.diceRolling = true;
          next.race.log.unshift(`${p.name} がサイコロを振っています…`);
          await saveRoom(next);
        } else if (next.race.diceRolling) {
          const d = DICE[Math.floor(Math.random() * DICE.length)];
          next.race.dice = d.key;
          next.race.diceRolling = false;
          next.race.log.unshift(`${p.name} の出目：${d.icon} ${d.label}`);
          await saveRoom(next);
        } else {
          const horse = cpuChooseMove(next, p);
          if (!horse) return;
          doMoveHorse(next, horse);
          await saveRoom(next);
        }
      }
    };
    const p = room.phase === "betting" ? currentBetPlayer(room) : currentPlayer(room);
    if ((room.phase === "betting" || room.phase === "racing") && p?.type === "cpu") {
      cpuTimer = setTimeout(cpuAction, room.race?.diceRolling ? 850 : 700);
    }
  }

  function displayPosition(hid, fallback) {
    if (animationState && animationState.horse === hid) return animationState.pos;
    return fallback;
  }

  function maybeStartMoveAnimation() {
    const move = room?.race?.lastMove;
    if (!move?.ts || move.ts === lastAnimatedMoveTs) return;
    const path = Array.isArray(move.path) && move.path.length ? move.path : [move.finalTarget];
    lastAnimatedMoveTs = move.ts;
    clearTimeout(animationTimer);
    let idx = 0;
    const step = () => {
      if (!room?.race?.lastMove || room.race.lastMove.ts !== move.ts) {
        animationState = null;
        return;
      }
      if (idx < path.length) {
        animationState = { horse: move.horse, pos: path[idx], ts: move.ts };
        idx += 1;
        render();
        animationTimer = setTimeout(step, 190);
      } else {
        animationState = null;
        render();
      }
    };
    step();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  }

  function render() {
    appEl.innerHTML = `
      <section class="hero">
        <h1>${GAME_TITLE}</h1>
        <div class="subtitle">1〜6人 / CPU最大5人 / スマホ同期対応 / 36マスすごろくレース</div>
      </section>
      ${!room ? renderHome() : renderRoom()}
    `;
    bindEvents();
  }

  function renderHome() {
    return `
      <section class="homeHeroCard">
        <h2 class="homeTitle">うまダッシュ<br>ターフ</h2>
        <div class="homeLead">スマホだけで遊べる、競馬すごろく風レースゲーム。部屋番号を共有して、家族・友人・CPUとすぐ対戦できます。</div>
        <div class="homeBadges">
          <span class="homeBadge">👥 1〜6人</span>
          <span class="homeBadge">🤖 CPU最大5人</span>
          <span class="homeBadge">🎲 サイコロ演出</span>
          <span class="homeBadge">📱 スマホ対応</span>
        </div>
      </section>
      <section class="homePanel">
        <div class="homeForm grid">
          <div><b>ゲームをはじめる</b><div class="small">1台目は部屋を作る、2台目以降は同じ部屋番号で入ります。</div></div>
          <label>名前<input id="playerName" value="${escapeHtml(localName)}" /></label>
          <label>部屋番号<input id="roomCode" value="${escapeHtml(roomCode || randomCode())}" maxlength="8" /></label>
          <div class="grid two">
            <button id="createRoom">部屋を作る</button>
            <button id="joinRoom" class="secondary">部屋に入る</button>
          </div>
          <div class="tiny">${online ? "Firebase同期ON：スマホ2台で同じ部屋に入れます。" : "ローカル練習モード：スマホ2台同期にはFirebase設定が必要です。"}</div>
        </div>
        <div class="homeHowTo">
          <b>遊び方</b>
          <ol class="small">
            <li>馬に 1・1・2 のチップを賭ける</li>
            <li>サイコロを振って、動かす馬を選ぶ</li>
            <li>3着まで決まったら配当計算</li>
            <li>3レース後に所持金が多い人の勝ち</li>
          </ol>
        </div>
      </section>
    `;
  }

  function renderRoom() {
    if (room.phase === "lobby") return renderLobby();
    return renderGame();
  }

  function renderLobby() {
    return `
      <section class="card">
        <div class="row between">
          <div><b>部屋番号：${room.code}</b><div class="tiny">相手のスマホで同じURLまたは部屋番号を入力</div></div>
          <span class="pill">${online ? "同期ON" : "ローカル"}</span>
        </div>
        <div class="grid" style="margin-top:10px">
          ${room.players.map((p, i) => `
            <div class="playerBox row between">
              <div class="row"><span class="chip" style="border-color:${p.color};">${i + 1}</span><b>${escapeHtml(p.name)}</b><span class="small">${p.type === "cpu" ? "CPU" : "人間"}</span></div>
              ${p.id === room.hostId ? `<span class="pill">親</span>` : ""}
            </div>`).join("")}
        </div>
        <div class="grid two">
          <button id="addCpu" class="secondary" ${!isHost() || room.players.length >= MAX_PLAYERS ? "disabled" : ""}>CPUを追加</button>
          <button id="startGame" class="good" ${!isHost() ? "disabled" : ""}>ゲーム開始</button>
        </div>
        <div class="small" style="margin-top:8px">賭けチップは全員 1・1・2。秘密の賭けは使わない設定です。</div>
      </section>
    `;
  }

  function renderGame() {
    return `
      ${renderScoreBoard()}
      ${renderRaceHeader()}
      ${renderTrack()}
      ${renderBets()}
      ${renderActionPanel()}
      ${renderPayout()}
      <section class="card"><b>ログ</b><div class="log">${room.race.log.slice(0, 40).map(x => `<div>${escapeHtml(x)}</div>`).join("")}</div></section>
    `;
  }

  function renderScoreBoard() {
    const sorted = [...room.players].sort((a, b) => b.money - a.money);
    return `<section class="card grid two">
      ${sorted.map(p => `<div class="playerBox ${currentPlayer()?.id === p.id && room.phase === "racing" ? "current" : ""}">
        <div class="row between"><b>${escapeHtml(p.name)}</b><span class="money">¥${p.money}</span></div>
        <div class="small">${p.type === "cpu" ? "CPU" : p.id === localId ? "あなた" : "人間"}</div>
      </div>`).join("")}
    </section>`;
  }

  function renderRaceHeader() {
    const dice = room.race.dice ? diceObj(room.race.dice) : null;
    const turn = room.phase === "betting" ? currentBetPlayer(room) : currentPlayer(room);
    return `<section class="card">
      <div class="row between">
        <div><b>第${room.raceNo}レース</b> <span class="pill">${phaseText(room.phase)}</span></div>
        <div class="pill">手番：${escapeHtml(turn?.name || "-")}</div>
      </div>
      <div class="row" style="margin-top:8px">
        <span class="pill">ペース：${room.race.paceHorse ? horseInfo(room.race.paceHorse).label : "未定"}</span>
        <span class="pill">出目：${dice ? `${dice.icon} ${dice.label}` : room.race.diceRolling ? "回転中" : "未振り"}</span>
        <span class="pill">3R倍率：${room.raceNo === 3 ? "2倍" : "通常"}</span>
      </div>
      <div class="dicePanel">${renderDiceVisual(room.race.dice, room.race.diceRolling)}</div>
    </section>`;
  }

  function renderDiceVisual(diceKey, rolling) {
    if (rolling) {
      return `<div class="diceStage">
        <div class="diceCube rolling">🎲</div>
        <div><div class="diceText">サイコロ回転中…</div><div class="diceFaces">🐴 🐴 🐴 🎩 🥕 🧲</div></div>
      </div>`;
    }
    const d = diceKey ? diceObj(diceKey) : null;
    return `<div class="diceStage">
      <div class="diceCube">${d ? d.icon : "🎲"}</div>
      <div><div class="diceText">${d ? `出目：${d.label}` : "サイコロ待ち"}</div><div class="diceFaces">🐴×3 / 🎩 / 🥕 / 🧲</div></div>
    </div>`;
  }

  function trackPoint(pos, laneIndex = 0) {
    const total = GOAL_LINE - MIN_POS + 4;
    const progress = Math.max(0, Math.min(1, (pos - MIN_POS) / total));
    const angleDeg = -90 + progress * 360;
    const angle = angleDeg * Math.PI / 180;
    const lane = (laneIndex - 3) * 1.6;
    const rx = 39 + lane;
    const ry = 35 + lane * .55;
    return {
      x: 50 + Math.cos(angle) * rx,
      y: 50 + Math.sin(angle) * ry,
      rot: angleDeg + 90
    };
  }

  function phaseText(phase) {
    return { lobby: "待機", betting: "賭け", racing: "レース", payout: "払い戻し", gameover: "終了" }[phase] || phase;
  }

  function boardSpaces() {
    const coords = [];
    // 10×10の外周で36マス。1〜7がスタート位置候補、36が全馬共通ゴール。
    for (let c = 1; c <= 10; c++) coords.push([1, c]);
    for (let r = 2; r <= 9; r++) coords.push([r, 10]);
    for (let c = 10; c >= 1; c--) coords.push([10, c]);
    for (let r = 9; r >= 2; r--) coords.push([r, 1]);
    return coords.map((xy, i) => ({ no: i + 1, row: xy[0], col: xy[1] }));
  }

  function renderTrack() {
    const cardsByHorse = Object.fromEntries(room.race.cards.map(c => [c.horse, c]));
    const lastMove = room.race.lastMove || {};
    const placed = {};
    const paddock = [];
    for (const hid of Object.keys(room.race.horses)) {
      const s = room.race.horses[hid];
      if (s.status === "finished") continue;
      if (s.pos < 1) paddock.push(hid);
      else {
        const display = displayPosition(hid, s.pos);
        const no = Math.max(1, Math.min(GOAL_LINE, display));
        placed[no] ||= [];
        placed[no].push(hid);
      }
    }
    const spaces = boardSpaces();
    const finishOrder = room.race.finishOrder.map((hid, idx) => `${idx + 1}着 ${horseInfo(hid).icon}${horseInfo(hid).label}`).join(" / ") || "まだゴールなし";
    return `<section class="card">
      <div class="row between"><b>36マスコース</b><span class="small">36を超えたらゴール。同じマスには止まれないので、埋まっていたら戻ります。</span></div>
      ${lastMove.blocked ? `<div class="moveBanner">${horseDisplayName(lastMove.horse)}：${lastMove.rawTarget}マス目が埋まっていたため、${lastMove.finalTarget}マス目まで1マスずつ戻りました！</div>` : ""}
      <div class="sugorokuBoardWrap">
        <div class="sugorokuBoard">
          ${Array.from({ length: 100 }).map((_, idx) => {
            const row = Math.floor(idx / 10) + 1;
            const col = idx % 10 + 1;
            const sp = spaces.find(s => s.row === row && s.col === col);
            if (!sp) return `<div class="space empty"></div>`;
            const horses = placed[sp.no] || [];
            const cls = `space path ${sp.no <= 7 ? "start" : ""} ${sp.no === GOAL_LINE ? "finish" : ""} ${sp.no === PACE_SPACE ? "pace" : ""}`;
            return `<div class="${cls}">
              <div class="spaceNum">${sp.no}</div>
              <div class="spaceLabel">${sp.no <= 7 ? "START" : sp.no === GOAL_LINE ? "GOAL" : sp.no === PACE_SPACE ? "PACE" : ""}</div>
              <div class="spaceHorses">
                ${horses.map(hid => {
                  const hi = horseInfo(hid);
                  const c = cardsByHorse[hid];
                  const isLatest = lastMove.horse === hid;
                  return `<span class="miniHorse ${isLatest ? "latest" : ""} ${isLatest && lastMove.blocked ? "blocked" : ""} ${animationState?.horse === hid ? "animating" : ""} ${c?.moved ? "moved" : ""}" style="--horse-color:${hi.color};" title="${c?.name || hi.label}">🐎</span>`;
                }).join("")}
              </div>
            </div>`;
          }).join("")}
        </div>
      </div>
      <div class="paddock"><b>出走待ち</b>${paddock.length ? paddock.map(hid => {
        const hi = horseInfo(hid);
        const s = room.race.horses[hid];
        return `<span class="pill"><span class="miniHorse" style="--horse-color:${hi.color};">🐎</span>${hi.icon}${hi.label} ${s.pos}</span>`;
      }).join("") : `<span class="small">なし</span>`}</div>
      <div class="paddock"><b>ゴール</b><span class="small">${finishOrder}</span></div>
      <div class="paddock"><b>出走馬</b>${room.race.cards.map(c => {
        const h = horseInfo(c.horse);
        const s = room.race.horses[c.horse];
        return `<span class="pill"><span class="miniHorse" style="--horse-color:${h.color};">🐎</span>${h.icon}${c.name}<span class="tiny">${c.archetype} / 開始${s.startPos}</span></span>`;
      }).join("")}</div>
      <div class="cardStrip">
        ${room.race.cards.map(c => {
          const h = horseInfo(c.horse);
          const state = room.race.horses[c.horse];
          const need = state.status === "finished" ? "ゴール済" : `あと${Math.max(1, GOAL_LINE - state.pos + 1)}マス以上`;
          return `<div class="raceCardMini ${c.moved ? "moved" : ""}">
            <div class="row between"><b>${h.icon} ${c.name}</b><span class="remainTag">${need}</span></div>
            <div class="tiny">${c.archetype} / 開始${state.startPos}</div>
            <div class="moveNums"><span>🐴${c.moves.head}</span><span>🎩${c.moves.hat}</span><span>🥕${c.moves.carrot}</span><span>🧲${c.moves.shoe}</span></div>
          </div>`;
        }).join("")}
      </div>
    </section>`;
  }

  function renderBets() {
    const visible = true;
    return `<section class="card">
      <div class="row between"><b>賭けエリア</b><span class="small">その馬への総票数が多いほど配当は下がります</span></div>
      <div class="betArea" style="margin-top:8px">
        ${HORSES.map(h => {
          const bets = room.race.bets.filter(b => b.horse === h.id);
          const total = bets.reduce((s, b) => s + Math.max(0, b.chip), 0);
          return `<div class="horseBet">
            ${(() => { const c = horseCard(h.id); const s = room.race.horses[h.id]; return `<div class="row between"><b>${h.icon} ${c?.name || h.label}</b><span class="pill">${total}票</span></div><div class="tiny">${c?.archetype || ""} / 位置${s?.pos ?? "-"}</div>`; })()}
            <div class="chips">${bets.map(b => {
              const p = room.players.find(x => x.id === b.playerId);
              const canSee = visible || b.playerId === localId;
              return `<span title="${escapeHtml(p?.name || "")}" class="chip ${!canSee ? "hidden" : ""} ${b.chip === 0 ? "zero" : ""}" style="border-color:${p?.color || "#333"};">${canSee ? chipLabel(b.chip) : "?"}</span>`;
            }).join("")}</div>
          </div>`;
        }).join("")}
      </div>
    </section>`;
  }

  function renderActionPanel() {
    if (room.phase === "betting") return renderBetAction();
    if (room.phase === "racing") return renderRaceAction();
    const quitBtn = `<button id="quitToTop" class="secondary">ゲームをやめる</button>`;
    if (room.phase === "payout") return `<section class="actions"><div class="primaryActionRow"><button id="nextRace" class="good" ${!isHost() ? "disabled" : ""}>次のレースへ</button>${quitBtn}</div></section>`;
    if (room.phase === "gameover") return `<section class="actions"><div class="primaryActionRow"><button id="backToLobby" ${!isHost() ? "disabled" : ""}>ロビーに戻る</button>${quitBtn}</div></section>`;
    return "";
  }

  function renderBetAction() {
    const p = currentBetPlayer(room);
    if (p.id !== localId) return `<section class="actions compactAction"><div class="primaryActionRow"><b>${escapeHtml(p.name)}の賭け待ち</b><button id="quitToTop" class="secondary">ゲームをやめる</button></div><div class="small">CPUなら自動で進みます。やめると自分の操作はCPUが代理します。</div></section>`;
    const remaining = remainingChips(room, p.id);
    const used = alreadyBetHorses(room, p.id);
    return `<section class="actions compactAction">
      <div class="primaryActionRow"><b>あなたの賭け</b><button id="quitToTop" class="secondary">ゲームをやめる</button></div>
      <div class="small">チップを選んでから馬を選択。同じ馬に2枚は置けません。</div>
      <div class="row" style="margin-top:8px">
        ${remaining.map((c, idx) => `<button class="secondary chipBtn ${selectedChip === c ? "selected" : ""}" data-chip="${c}" data-idx="${idx}">チップ ${chipLabel(c)}</button>`).join("")}
      </div>
      <div class="row" style="margin-top:8px">
        ${room.race.cards.map(c => `<button class="horseBetBtn" data-horse="${c.horse}" ${used.has(c.horse) ? "disabled" : ""}>${horseInfo(c.horse).icon} ${c.name}</button>`).join("")}
      </div>
    </section>`;
  }

  function renderRaceAction() {
    const p = currentPlayer(room);
    if (p.id !== localId) return `<section class="actions compactAction"><div class="primaryActionRow"><span class="stickyDiceMini"><span class="stickyDiceIcon">${room.race.dice ? diceObj(room.race.dice).icon : room.race.diceRolling ? "🎲" : "⏳"}</span>${room.race.dice ? diceObj(room.race.dice).label : room.race.diceRolling ? "回転中" : "待機"}</span><b>${escapeHtml(p.name)}の手番待ち</b><button id="quitToTop" class="secondary">ゲームをやめる</button></div><div class="small">CPUならサイコロ演出後に自動で進みます。</div></section>`;
    if (room.race.diceRolling) return `<section class="actions compactAction"><div class="primaryActionRow"><span class="stickyDiceMini"><span class="stickyDiceIcon">🎲</span>回転中…</span><button id="quitToTop" class="secondary">ゲームをやめる</button></div><div class="small">出目が決まるまで少し待ってください。</div></section>`;
    if (!room.race.dice) return `<section class="actions compactAction"><div class="primaryActionRow"><button id="rollDice" class="good">🎲 サイコロを振る</button><button id="quitToTop" class="secondary">ゲームをやめる</button></div><div class="small">ボタンは画面下に固定表示されます。</div></section>`;
    const dice = diceObj(room.race.dice);
    const nextForView = clone(room);
    const cards = activeCards(nextForView);
    return `<section class="actions compactAction">
      <div class="primaryActionRow"><span class="stickyDiceMini"><span class="stickyDiceIcon">${dice.icon}</span>出目：${dice.label}</span><button id="quitToTop" class="secondary">ゲームをやめる</button></div>
      <div class="small">動かす馬を選んでください。選んだ馬がコース上を進みます。</div>
      <div class="row" style="margin-top:8px">
        ${cards.map(c => `<button class="moveHorseBtn" data-horse="${c.horse}">${horseInfo(c.horse).icon} ${c.name} +${c.moves[room.race.dice]}</button>`).join("")}
      </div>
    </section>`;
  }

  function renderPayout() {
    if (!room.race?.payout) return "";
    const order = room.race.finishOrder.map((hid, idx) => `${idx + 1}着 ${horseDisplayName(hid)}`).join(" / ");
    const last = room.race.lastHorse ? horseDisplayName(room.race.lastHorse) : "-";
    const winner = [...room.players].sort((a, b) => b.money - a.money)[0];
    return `<section class="card">
      <b>${room.phase === "gameover" ? "最終結果" : "払い戻し"}</b>
      <div class="row" style="margin-top:8px"><span class="pill">${order}</span><span class="pill">最下位 ${last}</span><span class="pill">倍率 ${room.race.payout.multiplier}倍</span></div>
      <div class="grid" style="margin-top:10px">
        ${room.race.payout.playerResults.map(res => `<div class="playerBox">
          <div class="row between"><b>${escapeHtml(res.name)}</b><span class="money">${res.net >= 0 ? "+" : ""}${res.net} → ¥${res.after}</span></div>
          <div class="tiny">${res.details.length ? escapeHtml(res.details.join(" / ")) : "的中・支払いなし"}</div>
        </div>`).join("")}
      </div>
      ${room.phase === "gameover" ? `<div class="card" style="box-shadow:none;background:#fff;"><span class="rank">🏆</span> 優勝：<b>${escapeHtml(winner.name)}</b> ¥${winner.money}</div>` : ""}
    </section>`;
  }

  function bindEvents() {
    document.getElementById("createRoom")?.addEventListener("click", createRoom);
    document.getElementById("joinRoom")?.addEventListener("click", joinRoom);
    
    document.getElementById("addCpu")?.addEventListener("click", addCpu);
    document.getElementById("startGame")?.addEventListener("click", startGame);
    document.getElementById("rollDice")?.addEventListener("click", rollDice);
    document.getElementById("nextRace")?.addEventListener("click", nextRace);
    document.getElementById("backToLobby")?.addEventListener("click", backToLobby);
    document.getElementById("quitToTop")?.addEventListener("click", quitToTop);
    document.querySelectorAll(".chipBtn").forEach(btn => btn.addEventListener("click", () => {
      selectedChip = Number(btn.dataset.chip);
      render();
    }));
    document.querySelectorAll(".horseBetBtn").forEach(btn => btn.addEventListener("click", () => placeBet(btn.dataset.horse)));
    document.querySelectorAll(".moveHorseBtn").forEach(btn => btn.addEventListener("click", () => moveHorse(btn.dataset.horse)));
  }

  await initFirebase().catch(err => {
    console.warn("Firebase init failed", err);
    online = false;
  });
  if (roomCode) await openRoom(roomCode);
  render();
</script>
</body>
</html>
